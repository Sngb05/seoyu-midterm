  };
  if (!['study', 'practice', 'a4'].includes(S.tab)) S.tab = 'study';
  if (S.week !== 'all' && !WEEKS.some(w => w.week === S.week)) S.week = 'all';
  if (!Array.isArray(S.queue)) S.queue = [];

  let db = null;
  let dbState = 'connecting';
  let flushing = false;
  let retryTimer = 0;

  const $ = (sel) => document.querySelector(sel);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const rich = (s) => esc(s).replace(/\s*\(보충\)/g, '<span class="supp">보충</span>');
  const nowIso = () => new Date().toISOString();

  function pagesLabel(arr) {
    const p = Array.from(new Set((arr || []).map(Number).filter((n) => n > 0))).sort((a, b) => a - b);
    if (!p.length) return '';
    const out = [];
    let s = p[0], e = p[0];
    for (let i = 1; i <= p.length; i++) {
      if (p[i] === e + 1) { e = p[i]; continue; }
      out.push(s === e ? String(s) : s + '–' + e);
      s = e = p[i];
    }
    return 'p.' + out.join(', ');
  }

  // Every starrable item gets a stable key; stored docs also keep their label/text.
  const ITEMS = {};
  const QUESTIONS = [];
  for (const w of WEEKS) {
    (w.keywords || []).forEach((k, i) => { ITEMS['w' + w.week + '-k' + (i + 1)] = { kind: 'keyword', week: w.week, label: k.term, text: [k.def, k.detail].filter(Boolean).join(' / ') }; });
    (w.memos || []).forEach((m, i) => { ITEMS['w' + w.week + '-m' + (i + 1)] = { kind: 'memo', week: w.week, label: (m.prof ? '교수님 강조 p.' : '내 메모 p.') + m.page, text: m.text + (m.context ? ' — ' + m.context : '') }; });
    (w.a4 || []).forEach((t, i) => { ITEMS['w' + w.week + '-a' + (i + 1)] = { kind: 'line', week: w.week, label: '', text: t }; });
    (w.questions || []).forEach((q, i) => {
      const key = 'w' + w.week + '-q' + (i + 1);
      ITEMS[key] = { kind: 'question', week: w.week, label: q.q, text: (q.outline || []).join(' / ') };
      QUESTIONS.push(Object.assign({ key: key, week: w.week }, q));
    });
  }
  (DATA.integrated || []).forEach((q, i) => {
    const key = 'x-q' + (i + 1);
    ITEMS[key] = { kind: 'question', week: 'x', label: q.q, text: (q.outline || []).join(' / ') };
    QUESTIONS.push(Object.assign({ key: key, week: 'x' }, q));
  });
  const KIND_LABEL = { keyword: '키워드', memo: '메모', line: '한 줄', question: '문제' };
  const weekTitle = (wk) => (wk === 'x' ? '통합형' : ((WEEKS.find((w) => String(w.week) === String(wk)) || {}).title || ''));
  const groupTitle = (wk) => (wk === 'x' ? '통합형 문제' : wk + '주차 ' + weekTitle(wk));

  function dday() {
    try {
      const today = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
      const d = Math.round((Date.parse(DATA.exam.date + 'T00:00:00Z') - Date.parse(today + 'T00:00:00Z')) / 86400000);
      return d > 0 ? 'D-' + d : d === 0 ? 'D-DAY' : '';
    } catch (e) { return ''; }
  }

  const starBtn = (key) => {
    const on = !!S.a4[key];
    return '<button type="button" class="star" data-act="star" data-key="' + key + '" aria-pressed="' + on + '" aria-label="' + (on ? 'A4 후보에서 빼기' : 'A4 후보에 담기') + '"><span aria-hidden="true">' + (on ? '★' : '☆') + '</span></button>';
  };

  /* ---------- Views ---------- */
  const guideHTML = () =>
    '<section class="guide"><p class="guide-h">버스에서 이렇게 써요</p><ol>' +
    '<li><b>오전</b> 공부 탭에서 주차별로 흐름 → 메모 → 키워드 순서로 읽기</li>' +
    '<li><b>오후</b> 문제 탭에서 개요를 먼저 떠올리고, 뼈대를 펼쳐 비교한 뒤 채점</li>' +
    '<li><b>막힌 것</b>은 ☆를 눌러 A4 후보에 담기. 수요일에 이 목록으로 A4를 만들어요</li>' +
    '</ol><button type="button" class="btn ghost sm" data-act="guide">알겠어요</button></section>';

  function renderOverview() {
    const lines = DATA.overview || [];
    return (S.guideDone ? '' : guideHTML()) +
      '<section class="ov-intro"><p class="eyebrow">시험범위 2~7주차 · 원본 ' + WEEKS.reduce((a, w) => a + (w.pageCount || 0), 0) + '쪽</p>' +
      '<h1>서유럽 사회를 보는 여섯 개의 창</h1>' +
      (lines.length ? '<ul class="ov-lines">' + lines.map((l) => '<li>' + rich(l) + '</li>').join('') + '</ul>' : '') +
      '</section>' +
      '<section class="sec"><ul class="ov-list">' + WEEKS.map((w) =>
        '<li><button type="button" class="ov-item" data-act="week" data-week="' + w.week + '">' +
        '<span class="ov-num">' + w.week + '</span>' +
        '<span class="ov-title">' + esc(w.title) + '</span>' +
        '<span class="ov-one">' + rich(w.oneLiner) + '</span>' +
        '<span class="ov-meta">메모 ' + (w.memos || []).length + ' · 키워드 ' + (w.keywords || []).length + ' · 예상문제 ' + (w.questions || []).length + '</span>' +
        '</button></li>').join('') + '</ul></section>';
  }

  function kwHTML(w, k, i) {
    const key = 'w' + w.week + '-k' + (i + 1);
    const hidden = S.hideDefs && !S.flipped.has(key);
    const tags = (Number(k.importance) >= 3 ? '<span class="tag core">핵심</span>' : '') + (k.memo ? '<span class="tag mine">' + esc(w.memoTag || '내 메모') + '</span>' : '');
    const body = hidden
      ? '<button type="button" class="reveal-def" data-act="flip" data-key="' + key + '">떠올린 뒤 눌러서 확인</button>'
      : '<p class="kw-def">' + rich(k.def) + '</p>' + (k.detail ? '<p class="kw-detail">' + rich(k.detail) + '</p>' : '') + (pagesLabel(k.pages) ? '<p class="pg">' + pagesLabel(k.pages) + '</p>' : '');
    return '<div class="kw" data-kw="' + key + '"><div class="kw-head"><p class="kw-term">' + esc(k.term) + '</p>' + tags + '</div>' + starBtn(key) + '<div class="kw-body">' + body + '</div></div>';
  }

  function renderWeek() {
    const w = WEEKS.find((x) => x.week === S.week);
    const idx = WEEKS.indexOf(w);
    const prev = WEEKS[idx - 1], next = WEEKS[idx + 1];
    const memos = w.memos || [];
    let h = '';
    h += '<section class="hero"><p class="eyebrow">' + w.week + '주차 · 원본 ' + w.pageCount + '쪽</p><h1>' + esc(w.title) + '</h1><p class="one">' + rich(w.oneLiner) + '</p>' +
      (w.bigQuestion ? '<p class="bigq"><b>핵심 질문</b>' + rich(w.bigQuestion) + '</p>' : '') + '</section>';
    h += '<section class="sec"><div class="sec-h"><h2>흐름</h2><span class="hint">이것만 읽어도 큰 그림</span></div><ol class="flow">' +
      (w.flow || []).map((f) => '<li><span>' + rich(f) + '</span></li>').join('') + '</ol></section>';
    if (memos.length) {
      h += '<section class="sec"><div class="sec-h"><h2>' + esc(w.memoTitle || '내 메모') + '</h2><span class="hint">' + memos.length + '개 · ' + esc(w.memoHint || '') + '</span></div><div class="stack">' +
        memos.map((m, i) => '<div class="memo"><div class="memo-main"><p class="memo-text">' + esc(m.text) + '</p><p class="memo-meta">' + (m.prof && w.memoTitle !== '교수님 강조' ? '<span class="tag core">교수님 강조</span> ' : '') + esc(m.context || '') + (m.context ? ' · ' : '') + 'p.' + esc(m.page) + '</p>' +
          (m.meaning ? '<p class="memo-why">' + rich(m.meaning) + '</p>' : '') + '</div>' + starBtn('w' + w.week + '-m' + (i + 1)) + '</div>').join('') + '</div></section>';
    }
    h += '<section class="sec"><div class="sec-h"><h2>키워드</h2><button type="button" class="toggle" data-act="hideDefs" aria-pressed="' + S.hideDefs + '">' + (S.hideDefs ? '뜻 모두 보이기' : '뜻 가리고 떠올리기') + '</button></div><div class="stack">' +
      (w.keywords || []).map((k, i) => kwHTML(w, k, i)).join('') + '</div></section>';
    h += '<section class="sec"><div class="sec-h"><h2>소주제별 정리</h2><span class="hint">눌러서 펼치기</span></div><div class="stack">' +
      (w.sections || []).map((s) => '<details class="sub"><summary><span>' + esc(s.heading) + '</span><span class="pg">' + pagesLabel(s.pages) + '</span></summary><ul>' +
        (s.points || []).map((p) => '<li>' + rich(p) + '</li>').join('') + '</ul></details>').join('') + '</div></section>';
    h += '<section class="sec"><div class="sec-h"><h2>A4에 옮길 만한 줄</h2><span class="hint">막히는 것만 ☆</span></div><ul class="lines">' +
      (w.a4 || []).map((t, i) => '<li><span>' + rich(t) + '</span>' + starBtn('w' + w.week + '-a' + (i + 1)) + '</li>').join('') + '</ul></section>';
    if ((w.links || []).length) {
      h += '<section class="sec"><div class="sec-h"><h2>다른 주차와 연결</h2></div><ul class="links">' + w.links.map((l) => '<li>' + rich(l) + '</li>').join('') + '</ul></section>';
    }
    h += '<nav class="pager" aria-label="주차 이동">' +
      (prev ? '<button type="button" class="btn ghost" data-act="week" data-week="' + prev.week + '">← ' + prev.week + '주차</button>' : '<button type="button" class="btn ghost" data-act="week" data-week="all">← 전체</button>') +
      '<button type="button" class="btn" data-act="tab" data-tab="practice" data-pweek="' + w.week + '">' + w.week + '주차 문제</button>' +
      (next ? '<button type="button" class="btn ghost" data-act="week" data-week="' + next.week + '">' + next.week + '주차 →</button>' : '<span></span>') +
      '</nav>';
    return h;
  }

  function statusOk(q) {
    const g = (S.practice[q.key] || {}).grade;
    if (S.filter === 'todo') return !g;
    if (S.filter === 'weak') return g === 'mid' || g === 'no';
    return true;
  }

  function qHTML(q) {
    const p = S.practice[q.key] || {};
    const open = S.revealed.has(q.key);
    const lik = Math.min(3, Math.max(1, Number(q.likelihood) || 2));
    const where = q.week === 'x'
      ? '통합형' + ((q.weeks || []).length ? ' · ' + q.weeks.map((n) => n + '주차').join('·') : '')
      : q.week + '주차 ' + esc(weekTitle(q.week));
    return '<article class="q" id="q-' + q.key + '">' +
      '<div class="q-meta"><span class="lik lik-' + lik + '">' + ['', '가능성 낮음', '가능성 중간', '가능성 높음'][lik] + '</span><span>' + where + '</span></div>' +
      '<h3>' + esc(q.q) + '</h3>' +
      '<label class="note-l" for="note-' + q.key + '">내 개요 (선택)</label>' +
      '<textarea id="note-' + q.key + '" class="note" data-key="' + q.key + '" rows="3" placeholder="서론·본론·결론 키워드만 짧게">' + esc(p.note || '') + '</textarea>' +
      '<button type="button" class="btn' + (open ? ' ghost' : '') + '" data-act="reveal" data-key="' + q.key + '" aria-expanded="' + open + '">' + (open ? '뼈대 접기' : '답안 뼈대 보기') + '</button>' +
      '<div class="answer"' + (open ? '' : ' hidden') + '>' +
      '<ol class="outline">' + (q.outline || []).map((o) => '<li>' + rich(o) + '</li>').join('') + '</ol>' +
      ((q.mustKeywords || []).length ? '<div class="must"><span class="must-l">꼭 넣을 키워드</span>' + q.mustKeywords.map((m) => '<span>' + esc(m) + '</span>').join('') + '</div>' : '') +
      (q.why ? '<p class="why">출제 근거 · ' + rich(q.why) + '</p>' : '') +
      (pagesLabel(q.pages) ? '<p class="pg">원본 ' + pagesLabel(q.pages) + '</p>' : '') +
      '</div>' +
      '<div class="q-foot"><div class="grade" role="group" aria-label="스스로 채점">' +
      [['ok', '술술'], ['mid', '애매'], ['no', '막힘']].map((g) => '<button type="button" data-act="grade" data-key="' + q.key + '" data-g="' + g[0] + '" aria-pressed="' + (p.grade === g[0]) + '">' + g[1] + '</button>').join('') +
      '</div>' + starBtn(q.key) + '</div>' +
      '</article>';
  }

  function renderPractice() {
    const opts = [{ v: 'all', t: '전체' }].concat(WEEKS.map((w) => ({ v: String(w.week), t: w.week + '주차' })));
    if ((DATA.integrated || []).length) opts.push({ v: 'x', t: '통합형' });
    const list = QUESTIONS.filter((q) => (S.pWeek === 'all' || String(q.week) === String(S.pWeek)) && statusOk(q));
    const graded = QUESTIONS.filter((q) => (S.practice[q.key] || {}).grade).length;
    return '<section class="sec first"><div class="sec-h"><h2 class="big">서술형 예상문제</h2><span class="hint">' + graded + '/' + QUESTIONS.length + ' 채점</span></div>' +
      '<p class="lede">개요를 먼저 떠올려 몇 단어로 적고, 뼈대를 펼쳐 비교한 뒤 채점해요. 막힌 문제는 ☆로 A4 후보에 담아요.</p>' +
      '<div class="filters" role="group" aria-label="주차">' + opts.map((o) => '<button type="button" class="chip sm" data-act="pweek" data-v="' + o.v + '" aria-pressed="' + (String(S.pWeek) === o.v) + '">' + o.t + '</button>').join('') + '</div>' +
      '<div class="filters" role="group" aria-label="채점 상태">' + [['all', '모두'], ['todo', '안 푼 것'], ['weak', '애매·막힘']].map((o) => '<button type="button" class="chip sm" data-act="pfilter" data-v="' + o[0] + '" aria-pressed="' + (S.filter === o[0]) + '">' + o[1] + '</button>').join('') +
      '<button type="button" class="chip sm accent" data-act="random">무작위 한 문제</button></div></section>' +
      '<div class="stack" style="margin-top:16px">' + (list.length ? list.map(qHTML).join('') : '<p class="empty">조건에 맞는 문제가 없어요.</p>') + '</div>';
  }

  function a4Entries() {
    return Object.keys(S.a4).map((key) => Object.assign({ key: key }, ITEMS[key] || {}, S.a4[key] || {}));
  }
  const ORDER = () => WEEKS.map((w) => String(w.week)).concat(['x']);

  function renderA4() {
    const entries = a4Entries();
    const groups = ORDER().map((wk) => ({ wk: wk, items: entries.filter((e) => String(e.week) === wk) })).filter((g) => g.items.length);
    const weak = QUESTIONS.filter((q) => { const g = (S.practice[q.key] || {}).grade; return g === 'mid' || g === 'no'; });
    let h = '<section class="sec first"><div class="sec-h"><h2 class="big">A4 후보</h2><span class="hint">★ ' + entries.length + '개</span></div>' +
      '<p class="lede">' + (db ? '떠올리다 막힌 것만 모아요. 수요일에 이 목록으로 양면 A4를 조판합니다.' : '떠올리다 막힌 것만 모아요. 수요일에 「목록 전체 복사」를 눌러 Claude에게 붙여 넣으면 이 목록으로 양면 A4를 조판해요.') + '</p>' +
      '<div class="row"><button type="button" class="btn" data-act="copy">목록 전체 복사</button><span id="copyMsg" class="hint" role="status"></span></div>' +
      '<textarea id="copyFallback" class="note" rows="6" readonly hidden aria-label="복사할 목록"></textarea></section>';
    if (groups.length) {
      h += groups.map((g) => '<section class="sec"><div class="sec-h"><h2>' + esc(groupTitle(g.wk)) + '</h2><span class="hint">' + g.items.length + '개</span></div><ul class="a4list">' +
        g.items.map((e) => '<li><div><span class="tag">' + (KIND_LABEL[e.kind] || '') + '</span>' + (e.label ? '<b>' + esc(e.label) + '</b>' : '') + (e.text ? '<p>' + rich(e.text) + '</p>' : '') + '</div>' + starBtn(e.key) + '</li>').join('') +
        '</ul></section>').join('');
    } else {
      h += '<section class="sec"><div class="empty-card"><p><b>아직 담은 게 없어요.</b></p><p>공부·문제 탭에서 ☆를 누르면 여기에 모여요.</p></div></section>';
    }
    h += '<section class="sec"><div class="sec-h"><h2>다시 볼 문제</h2><span class="hint">애매·막힘 ' + weak.length + '개</span></div>' +
      (weak.length
        ? '<ul class="a4list">' + weak.map((q) => {
            const p = S.practice[q.key];
            return '<li><div><span class="tag g-' + p.grade + '">' + (p.grade === 'no' ? '막힘' : '애매') + '</span><b>' + esc(q.q) + '</b>' + (p.note ? '<p class="hint">내 개요: ' + esc(p.note) + '</p>' : '') + '</div><button type="button" class="btn ghost sm" data-act="goq" data-key="' + q.key + '">풀기</button></li>';
          }).join('') + '</ul>'
        : '<p class="hint">문제 탭에서 애매·막힘으로 채점한 문제가 여기 모여요.</p>') + '</section>';
    return h;
  }

  function exportText() {
    const stamp = new Intl.DateTimeFormat('ko-KR', { timeZone: 'Asia/Seoul', month: 'numeric', day: 'numeric', hour: 'numeric', minute: '2-digit' }).format(new Date());
    const out = ['[서유럽 A4 후보] ' + stamp];
    const entries = a4Entries();
    ORDER().forEach((wk) => {
      const items = entries.filter((e) => String(e.week) === wk);
      if (!items.length) return;
      out.push('', '■ ' + groupTitle(wk));
      items.forEach((e) => out.push('- (' + (KIND_LABEL[e.kind] || '') + ') ' + (e.label ? e.label + ': ' : '') + (e.text || '')));
    });
    const weak = QUESTIONS.filter((q) => { const g = (S.practice[q.key] || {}).grade; return g === 'mid' || g === 'no'; });
    if (weak.length) {
      out.push('', '■ 다시 볼 문제');
      weak.forEach((q) => { const p = S.practice[q.key]; out.push('- [' + (p.grade === 'no' ? '막힘' : '애매') + '] ' + q.q + (p.note ? ' / 내 개요: ' + p.note : '')); });
    }
    return out.join('\n');
  }

  /* ---------- Render ---------- */
  function renderHeader() {
    $('#dday').textContent = dday() ? ' ' + dday() : '';
    const nav = $('#weekNav');
    nav.hidden = S.tab !== 'study';
    nav.innerHTML = '<button type="button" class="chip" data-act="week" data-week="all" aria-current="' + (S.week === 'all') + '">전체</button>' +
      WEEKS.map((w) => '<button type="button" class="chip" data-act="week" data-week="' + w.week + '" aria-current="' + (S.week === w.week) + '"><b>' + w.week + '</b> ' + esc(w.short || w.title) + '</button>').join('');
    document.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-selected', String(t.dataset.tab === S.tab)));
    updateCounts();
  }

  function updateCounts() {
    const graded = QUESTIONS.filter((q) => (S.practice[q.key] || {}).grade).length;
    $('#cntPractice').textContent = graded + '/' + QUESTIONS.length + ' 채점';
    $('#cntA4').textContent = Object.keys(S.a4).length + '개';
  }

  function render() {
    renderHeader();
    const v = $('#view');
    v.innerHTML = S.tab === 'study' ? (S.week === 'all' ? renderOverview() : renderWeek()) : S.tab === 'practice' ? renderPractice() : renderA4();
    const cur = document.querySelector('.chip[aria-current="true"]');
    if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: 'nearest', inline: 'center' });
  }

  const scrollKey = () => S.tab + (S.tab === 'study' ? ':' + S.week : '');
  function go(mutate, keepScroll) {
    S.scroll[scrollKey()] = window.scrollY;
    mutate();
    store.set('tab', S.tab);
    store.set('week', S.week);
    render();
    window.scrollTo(0, keepScroll ? (S.scroll[scrollKey()] || 0) : 0);
  }

  function paintStar(key) {
    document.querySelectorAll('[data-act="star"][data-key="' + key + '"]').forEach((b) => {
      const on = !!S.a4[key];
      b.setAttribute('aria-pressed', String(on));
      b.setAttribute('aria-label', on ? 'A4 후보에서 빼기' : 'A4 후보에 담기');
      b.firstElementChild.textContent = on ? '★' : '☆';
    });
  }
  function paintAll() {
    document.querySelectorAll('[data-act="star"]').forEach((b) => paintStar(b.dataset.key));
    document.querySelectorAll('[data-act="grade"]').forEach((b) => b.setAttribute('aria-pressed', String((S.practice[b.dataset.key] || {}).grade === b.dataset.g)));
    document.querySelectorAll('textarea.note[data-key]').forEach((t) => {
      if (document.activeElement === t) return;
      const v = (S.practice[t.dataset.key] || {}).note || '';
      if (t.value !== v) t.value = v;
    });
    updateCounts();
  }

  /* ---------- Saving: local first, then the artifact's db when reachable ---------- */
  function setSync() {
    const el = $('#sync');
    const n = S.queue.length;
    let state = 'ok', text = '저장됨';
    if (dbState === 'connecting') { state = 'wait'; text = n ? '저장 대기 ' + n : '연결 중'; }
    else if (!db) { state = 'local'; text = '이 기기에 저장'; }
    else if (n) { state = 'pending'; text = '저장 대기 ' + n; }
    el.dataset.state = state;
    el.textContent = text;
    el.title = state === 'pending' ? '연결되면 자동으로 저장돼요' : state === 'local' ? '이 기기 브라우저에만 저장돼요' : '';
  }

  function enqueue(col, key, op, body) {
    S.queue = S.queue.filter((x) => !(x.col === col && x.key === key));
    S.queue.push(op === 'set' ? { col: col, key: key, op: op, body: body } : { col: col, key: key, op: op });
    store.set('queue', S.queue);
    setSync();
    flush();
  }

  function scheduleRetry() {
    clearTimeout(retryTimer);
    retryTimer = setTimeout(flush, 20000);
  }

  async function flush() {
    if (!db || flushing) { setSync(); return; }
    flushing = true;
    try {
      while (S.queue.length && db) {
        const item = S.queue[0];
        try {
          const ref = db.collection(item.col).doc(item.key);
          if (item.op === 'set') await ref.set(item.body); else await ref.delete();
          S.queue = S.queue.filter((x) => x !== item);
          store.set('queue', S.queue);
        } catch (e) {
          const code = e && e.code;
          if (code === 'invalid_argument' || code === 'transform_error' || code === 'quota_exceeded') {
            S.queue = S.queue.filter((x) => x !== item);
            store.set('queue', S.queue);
            continue;
          }
          if (code === 'revoked' || code === 'not_granted' || code === 'capability_disabled' || code === 'capability_removed') {
            db = null; dbState = 'none';
            break;
          }
          scheduleRetry();
          break;
        }
      }
    } finally {
      flushing = false;
      setSync();
    }
  }

  function subscribe(col) {
    try {
      db.collection(col).onSnapshot((snap) => {
        const m = {};
        snap.docs.forEach((d) => { if (d.exists) { const v = d.data(); if (v) m[d.id] = v; } });
        S.queue.forEach((q) => { if (q.col === col) { if (q.op === 'set') m[q.key] = q.body; else delete m[q.key]; } });
        S[col] = m;
        store.set(col, m);
        if (S.tab === 'a4') render(); else paintAll();
      }, (err) => {
        if (err && err.code === 'unavailable') setTimeout(() => { if (db) subscribe(col); }, 5000);
      });
    } catch (e) { /* db unusable in this view */ }
  }

  async function initDb() {
    try {
      db = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('db') : null;
    } catch (e) { db = null; }
    dbState = db ? 'ready' : 'none';
    setSync();
    if (!db) return;
    subscribe('a4');
    subscribe('practice');
    flush();
  }

  /* ---------- Actions ---------- */
  function toggleStar(key) {
    const next = Object.assign({}, S.a4);
    if (next[key]) {
      delete next[key];
      enqueue('a4', key, 'delete');
    } else {
      const it = ITEMS[key] || {};
      const body = { key: key, week: it.week == null ? '' : it.week, kind: it.kind || '', label: it.label || '', text: it.text || '', at: nowIso() };
      next[key] = body;
      enqueue('a4', key, 'set', body);
    }
    S.a4 = next;
    store.set('a4', S.a4);
    if (S.tab === 'a4') { const y = window.scrollY; render(); window.scrollTo(0, y); }
    else { paintStar(key); updateCounts(); }
  }

  function savePractice(key, patch) {
    const q = QUESTIONS.find((x) => x.key === key);
    if (!q) return;
    const cur = S.practice[key] || {};
    const body = { key: key, week: q.week, q: q.q, grade: cur.grade || null, note: cur.note || '', at: nowIso() };
    Object.assign(body, patch);
    S.practice = Object.assign({}, S.practice, { [key]: body });
    store.set('practice', S.practice);
    enqueue('practice', key, 'set', body);
  }

  function setGrade(key, g) {
    const cur = (S.practice[key] || {}).grade;
    const grade = cur === g ? null : g;
    savePractice(key, { grade: grade });
    document.querySelectorAll('[data-act="grade"][data-key="' + key + '"]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.g === grade)));
    updateCounts();
  }

  const noteTimers = {};
  function saveNote(key, value) {
    clearTimeout(noteTimers[key]);
    if (((S.practice[key] || {}).note || '') === value) return;
    savePractice(key, { note: value });
  }

  function toggleReveal(key) {
    const art = document.getElementById('q-' + key);
    if (!art) return;
    const open = !S.revealed.has(key);
    if (open) S.revealed.add(key); else S.revealed.delete(key);
    art.querySelector('.answer').hidden = !open;
    const b = art.querySelector('[data-act="reveal"]');
    b.setAttribute('aria-expanded', String(open));
    b.textContent = open ? '뼈대 접기' : '답안 뼈대 보기';
    b.classList.toggle('ghost', open);
  }

  function focusQ(key) {
    requestAnimationFrame(() => {
      const el = document.getElementById('q-' + key);
      if (!el) return;
      const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      el.scrollIntoView({ block: 'start', behavior: reduce ? 'auto' : 'smooth' });
      el.classList.add('flash');
      setTimeout(() => el.classList.remove('flash'), 1600);
    });
  }

  function pickRandom() {
    const pool = QUESTIONS.filter((q) => !(S.practice[q.key] || {}).grade);
    const src = pool.length ? pool : QUESTIONS;
    if (!src.length) return;
    const q = src[Math.floor(Math.random() * src.length)];
    S.pWeek = 'all'; S.filter = 'all';
    render();
    focusQ(q.key);
  }

  function doCopy() {
    const text = exportText();
    const msg = $('#copyMsg');
    const fb = $('#copyFallback');
    const fallback = () => {
      fb.value = text; fb.hidden = false; fb.focus(); fb.select();
      msg.textContent = '복사가 막혀 있어요. 아래 글을 전체 선택해 복사하세요.';
    };
    try {
      navigator.clipboard.writeText(text).then(() => { msg.textContent = '복사했어요'; fb.hidden = true; }, fallback);
    } catch (e) { fallback(); }
  }

  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const d = b.dataset;
    switch (d.act) {
      case 'tab':
        go(() => { S.tab = d.tab; if (d.pweek) { S.pWeek = d.pweek; S.filter = 'all'; } }, !d.pweek);
        break;
      case 'week':
        go(() => { S.tab = 'study'; S.week = d.week === 'all' ? 'all' : Number(d.week); }, true);
        break;
      case 'star': toggleStar(d.key); break;
      case 'flip': {
        S.flipped.add(d.key);
        const card = b.closest('.kw');
        const w = WEEKS.find((x) => x.week === S.week);
        const i = Number(d.key.split('-k')[1]) - 1;
        if (card && w && w.keywords[i]) card.outerHTML = kwHTML(w, w.keywords[i], i);
        break;
      }
      case 'hideDefs':
        S.hideDefs = !S.hideDefs; S.flipped.clear(); store.set('hideDefs', S.hideDefs);
        { const y = window.scrollY; render(); window.scrollTo(0, y); }
        break;
      case 'reveal': toggleReveal(d.key); break;
      case 'grade': setGrade(d.key, d.g); break;
      case 'pweek': S.pWeek = d.v; render(); break;
      case 'pfilter': S.filter = d.v; render(); break;
      case 'random': pickRandom(); break;
      case 'copy': doCopy(); break;
      case 'goq':
        go(() => { S.tab = 'practice'; S.pWeek = 'all'; S.filter = 'all'; }, false);
        focusQ(d.key);
        break;
      case 'guide':
        S.guideDone = true; store.set('guideDone', true);
        { const g = b.closest('.guide'); if (g) g.remove(); }
        break;
    }
  });

  document.addEventListener('input', (e) => {
    const t = e.target;
    if (!t.matches || !t.matches('textarea.note[data-key]')) return;
    clearTimeout(noteTimers[t.dataset.key]);
    noteTimers[t.dataset.key] = setTimeout(() => saveNote(t.dataset.key, t.value), 1200);
  });
  document.addEventListener('focusout', (e) => {
    const t = e.target;
    if (t.matches && t.matches('textarea.note[data-key]')) saveNote(t.dataset.key, t.value);
  });
  window.addEventListener('online', flush);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) flush(); });

  function start(hot) {
    if (hot && typeof hot === 'object') {
      if (hot.tab) S.tab = hot.tab;
      if (hot.week != null) S.week = hot.week;
      if (hot.pWeek) S.pWeek = hot.pWeek;
      if (hot.filter) S.filter = hot.filter;
      (hot.revealed || []).forEach((k) => S.revealed.add(k));
    }
    render();
    if (hot && hot.scrollY) window.scrollTo(0, hot.scrollY);
    initDb();
  }
  const hotApi = window.claude && window.claude.hot;
  if (hotApi && typeof hotApi.snapshot === 'function') {
    hotApi.snapshot(() => ({ tab: S.tab, week: S.week, pWeek: S.pWeek, filter: S.filter, revealed: Array.from(S.revealed), scrollY: window.scrollY }));
  }
  if (hotApi && typeof hotApi.ready === 'function') hotApi.ready(start);
  else start((hotApi && hotApi.data) || {});
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
