,"why":"교수님이 p4 디오니소스 축제 그림 옆에 펜으로 '미메시스'를 쓰고 밑줄(강조 신호). 고대 파트가 3장(p4~6)으로 시대별 파트 중 가장 많음.","outline":["서론: 예술경영은 고대에도 있었다 — 공연을 운영하고 비용을 대는 체계.","본론 ①: 그리스 디오니소스 축제(와인 축제)를 '아르콘 에포니무스'와 '코레구스'가 꾸림. 아르콘은 축제를 주관한 관리, 코레구스는 합창단·의상 비용을 댄 부유한 시민이다. (보충)","본론 ②: 그리스 연극과 '미메시스(모방)'(교수님 펜). 극장 구조는 오케스트라·관객석·무대 건물 스케네(scene).","본론 ③: 로마는 음악과 무용 공연을 위한 상설 공연장을 건립(폼페이 원형극장).","결론: 운영자(관리)와 비용 부담자(후원자)의 분업은 오늘날 예술경영인·메세나의 원형이다."],"mustKeywords":["디오니소스 축제","아르콘 에포니무스","코레구스","미메시스","스케네","상설 공연장","폼페이 원형극장"],"pages":[4,5,6]},{"q":"메세나의 의미와 명칭의 유래를 설명하고, 20세기 이후 각국 메세나협의회의 설립 흐름을 서술하시오.","likelihood":2,"why":"어원 슬라이드(p13)와 연도별 협의회 연표(p15)가 구체 정보 중심이라 '흐름 정리'형 서술 문제로 내기 좋음. A4에 연도를 적어 가면 유리.","outline":["서론: 메세나 = 문화예술 지원 활동·지원자. 로마 마이케나스(68~8 BC, 호라티우스 후원)의 불어식 이름 메세느(Mécène)에서 유래.","본론 ①: 20세기 자본주의 사회에서 기업이 새 메세나 주체로 등장하며 조직화.","본론 ②: 1967년 미국 첫 메세나협의회 → 1970년대 영국·프랑스·캐나다(1976 영국 ABSA → Arts & Business, 1979 프랑스 Admical).","본론 ③: 1980년대 독일 등 유럽 7개국 → 1990년대 스페인·러시아·일본·한국 등(1991 CEREC, 1994 한국메세나협의회, 1997 국제 기업예술지원 네트워크).","결론: 개인 후원에서 출발한 메세나가 기업 중심의 국가·국제 네트워크로 제도화되었다."],"mustKeywords":["마이케나스","메세느(Mécène)","1967 미국","ABSA(Arts & Business)","Admical","CEREC","1994 한국메세나협의회"],"pages":[12,13,14,15]}],"a4":["예술경영: 예술가의 비현실적 측면을 현실적 맥락에서 뒷받침 — 예술적 이상↔구체적 현실, 예술가·생산자↔관객·소비자를 매개","예술은 분업화(공연: 창작자·재현자·공연자·무대기술 / 문학·미술: 출판기획자·큐레이터) → 묶어주는 매개자 = 예술 경영인 (예술가 감독·대등·보조 × 예술↔경영 6유형)","고대 그리스 디오니소스 축제(와인축제): '아르콘 에포니무스'(주관 관리)·'코레구스'(공연비 후원 시민) (역할 설명은 보충) / ★교수님 펜 '미메시스'(모방) / 극장: 오케스트라·스케네(scene)","고대 로마: 음악·무용 공연용 상설 공연장 건립 — 폼페이 원형극장","중세: 기독교의 로마 연극 배척→교회연극 / 12C 이후 교회 밖→14C 세속극(도시정부·길드) / 14C 성체축일 순환극(창세기~최후의 심판)","르네상스 이탈리아: 15C 막간극·16C 오페라 / 영국: 16C 말 극단 운영 면허제→직업 극단 / 미술: 14~16C 회화혁명→종교미술 대중화·작품 상품화","르네상스 프랑스: 16C 직업 연극, 1548 파리 최초 상설극장 부르고뉴극장, 최초 직업 예술경영인 발르랑르콩트, 17C 말 최초 국립극단 코메디프랑세즈(국가보조금)","근대: 국가 아카데미가 길드 대체(중앙집권 왕권), 귀족 수요→로코코 / 미술 18~19C 시장 주도·개인 부각(네덜란드), 전시회→길드 불필요 / 독일 18C 전후 국립극장","근대 음악: 16~17C 영국 연극 공연시장→음악시장(헨델·하이든), 18~19C 시장 매개 창작(모차르트·베토벤), 19C 초까지 티켓보다 후원자 의존","현대: ★생존 위기의 예술에 '국가' 지원 시작(교수님 펜) / 미국 연방정부 NEA 설립=미국식 예술경영 출발 (NEA 1965 설립, 보충) / 보멀&보엔 『공연예술: 경제적 딜레마』","유럽: 2차대전 후 국가·지방정부 지원 본격화 → 1980년대 경제위기로 축소(마가렛 대처) → 정부·공공 의존↓, 민간 재원 조성","메세나(Mécénat): 문화예술 지원 활동·지원자(문화·예술·과학 보호·지원) / 어원: 로마 정치가·시인 가이우스 클리니우스 마이케나스(68~8 BC) → 불어 메세느(Mécène), 호라티우스 후원","메세나 주체: 왕실·귀족(+가톨릭교회) → 중세 부르주아(현대적 메세나 시작) → 20C 기업(교육·연구·환경·스포츠·발명, '예술경영'으로 대체) / Q. 주체가 바뀌어도 지금도 존재하는 이유?","메세나협의회: 1967 미국 첫 창설 → 1970s 영·프·캐나다(1976 영국 ABSA→Arts & Business, 1979 프랑스 Admical) → 1980s 독일 등 유럽 7개국 → 1990s 스페인·러시아·일본·한국·홍콩·이스라엘","1991 CEREC(메세나협의회 유럽연합) / 1994 한국메세나협의회 발족 / 1997 국제 기업예술지원 네트워크","미술 메세나: 궁정·귀족·성직자 그림 주문(반다이크·뒤러) → 종교개혁 후 평범한 유럽인, 18C 영·프 수집=고상한 취미, 기증문화 / 쿠르베 '만남'(1854, 파브르 박물관)","음악 메세나: 교회·궁정 주축 — 루이 14세 코메디-발레 / 그림 예시: 뒤러의 막시밀리안 1세, 베토벤과 바르텐베르크 백작","샤토 무통 로칠드: 로칠드(독일어 로스차일드='붉은 방패', 유대계 금융 가문), 보르도 특1등급 5개 중 2개 / 1853 포이약 샤토 브란느-무통 매입·개명 → 1855 2등급","아티스트 라벨: 달리 1958·미로 1969·샤갈 1970·워홀 1975·아르망 1981 → 1973 1등급 격상(등급 역사상 유일) / 2006 크리스티 1945년산 12병 228,500유로 / 기증: 1975 페리에르 성→파리 대학교, 1982 베르메르 '천문학자'→루브르","Tous Mécènes!(우리 모두가 메세느들): 오르세(큰 메세느들·메세느들·기술·현물 지원 메세느들), 루브르(메세느들 서클·루브르의 친구들 협회)"],"links":["2주차 예술사조의 변화: 르네상스 회화혁명(종교미술 대중화·상품화), 귀족 수요가 이끈 로코코, 18~19세기 시장 주도 미술 — 사조 변화 뒤에 '누가 사고 후원했나'라는 예술경영의 축이 있다.","3주차 대학: 20세기 기업 메세나가 교육·연구로 확대되었고, 로칠드 가문은 1975년 페리에르 성을 파리 대학교에 기증 — 대학도 메세나의 수혜 대상.","5주차 유럽의 종교: 기독교의 로마 연극 배척→교회연극·성체축일 순환극, 가톨릭교회의 메세나 가담, 종교개혁 이후 미술 후원층이 평범한 유럽인으로 확대.","6·7주차 카페·영화: 근대 이후 부르주아·시민의 문화 소비와 예술의 시장화·대중화라는 공통 흐름 — 메세나 주체가 귀족→부르주아→기업→시민으로 넓어진 것과 같은 축으로 엮을 수 있다."],"memoTitle":"교수님 강조","memoHint":"강의 영상 속 펜 표시","memoTag":"교수님 강조","short":"예술경영","pageCount":26},{"week":5,"title":"유럽의 종교","oneLiner":"분열과 갈등으로 이어진 유럽 기독교사와 라이시테·이슬람·유대인 문제","bigQuestion":"유럽 기독교는 어떻게 분열해 왔고, 그 끝에 자리 잡은 프랑스의 라이시테는 왜 이슬람·유대인 같은 '이방인의 종교'와 갈등을 빚는가?","flow":["도입: 대성당이 상징하듯 유럽 문화의 중심엔 기독교가 있지만, 오늘날 서유럽 국가에는 국교가 없다(영국 성공회=종교단체, 독일=행정적 무관, 프랑스=라이시테).","수용: 짧은 평균 수명 속 영생 신앙, 그리고 로마 황제들의 통치 수단으로 기독교가 퍼졌다.","로마 붕괴 후: 이탈리아는 교황이 정치 공백을 메워 통일이 늦어졌고, 프랑스는 '기독교의 영지', 이베리아는 레콩키스타로 기독교 정체성을 세웠다.","분열①: 11세기 동서분열 — 서방 가톨릭(교황 중심) vs 동방정교(황제교황주의).","분열②: 16세기 남북분열 — 루터·칼뱅·헨리 8세의 종교개혁. 영국·독일·프랑스·네덜란드가 각기 다른 길을 갔고, 독일어권(신교)과 로망스어권(가톨릭)으로 문화가 갈렸다.","이슬람: 732년부터 십자군·오스만까지 대립한 아랍 문명. 19~20세기 식민지·신탁통치·이스라엘 건국을 거쳐 오늘날 이민자의 종교이자 갈등의 상징이 됐다.","라이시테 형성: 어원 laikos(민중) → laic(평신도). 18세기 계몽·혁명, 19세기 반기독교화를 거쳐 1801 → 1804 → 1905 법 제정으로 국가 이념이 됐다.","오늘날: 라이시테는 공화국의 통합 원칙이지만 반종교적 색채 때문에 정교분리를 하지 않는 이슬람과 충돌한다(1989 히잡사건, 극우정당).","유대인: 중세 금융업에서 근대 도시 번영의 주역이 됐지만 포그롬·드레퓌스 사건·나치 학살·비시정부 등 박해 끝에 이스라엘로 이주했다. 영국은 예외적으로 포용했다."],"sections":[{"heading":"도입: 학습 목표와 '국교 없는' 서유럽","pages":[1,2,3,4,5],"points":["학습목표 ① 서유럽의 기독교와 종교 분열의 역사 ② 이슬람과의 갈등 원인을 이해하기 위한 프랑스의 라이시테 ③ 유럽 소수자의 종교인 유대교와 이슬람.","도입 사진: 파리 노트르담·런던 세인트 폴·밀라노·쾰른 대성당. 유럽 도시 풍경의 중심에 기독교가 있다.","그러나 서유럽 국가에는 국교가 없다.","영국: 잉글랜드 국교회(성공회)는 종교단체 / 독일: 국가와 교회는 행정적으로 무관 / 프랑스: 반종교적 정책(라이시테, 정교분리)."]},{"heading":"유럽인들의 믿음, 기독교: 기독교를 선택한 이유","pages":[6,7],"points":["짧은 평균 수명 때문에 영원한 생명에 대한 믿음이 중요했다.","정치적 이유: 로마 제국이 커지면서 황제들이 제국 안정 유지를 위해 기독교를 활용했다.","콘스탄티누스의 '비잔틴 제국 정복'으로 기독교가 동쪽으로 확장됐다(슬라이드 표현).","콘스탄티누스는 313년 밀라노 칙령으로 기독교를 공인하고 330년 비잔티움(콘스탄티노폴리스)으로 수도를 옮겼다 (보충)","로마 카타콤(집단 묘지): 기독교인들은 부활 신앙 때문에 화장보다 매장을 선호했다."]},{"heading":"로마제국 붕괴 이후 서유럽에서의 기독교","pages":[8,9,10,11],"points":["이탈리아: 무너진 정치 질서의 자리를 종교 질서가 채웠고, 교황이 중앙조직의 수장으로 기능했다.","5~19세기 이탈리아의 중심성이 이어졌지만, 교황의 군주 역할은 통일 국가 건설을 방해했다.","프랑스는 '기독교의 중요한 영지': 6세기 클로비스 개종 → 8세기 샤를 마르텔, 푸아티에 전투에서 이슬람 격퇴 → 13세기 루이 9세 십자군 → 14세기 아비뇽 유수.","스페인·포르투갈: 기독교 뿌리 위에 이슬람 지배를 겪었고, 8~15세기 레콩키스타 투쟁 속에서 기독교 정체성을 세웠다.","스페인은 15세기 재정복 완성 후 '카톨릭 왕국' 명칭을 얻었고, 이탈리아 내정에도 깊이 관여했다.","산티아고 데 콤포스텔라가 서유럽 최고의 성지순례지로 떠올랐다(p11 순례 행렬·대성당 사진)."]},{"heading":"기독교의 분열 ① 11세기 동서분열","pages":[12],"points":["강조 박스: '유럽 기독교의 역사는 분열과 갈등의 과정'(p12~17에 반복).","서로마 지역 = 가톨릭: 게르만족의 기독교 개종과 교황에 대한 종교적 충성 경쟁.","동로마 지역 = 동방정교: 15세기까지 유지된 황제교황주의(caesaropapism) 전통 확립.","1054년 교황과 콘스탄티노폴리스 총대주교가 서로 파문하며 공식 분열했다 (보충)"]},{"heading":"기독교의 분열 ② 16세기 남북분열(종교개혁)","pages":[13,14,15,16,17],"points":["프로테스탄트 탄생: 독일 루터가 면죄부 판매 비판, 스위스 칼뱅이 기존 가톨릭교회 비판, 영국 헨리 8세가 성공회 설립(p14 초상화).","영국: 현지화된 가톨릭교회. 헨리 8세의 이혼·재혼 문제가 계기였고, 가톨릭교회 재산 몰수가 국가재정에 도움이 됐다.","독일: 라틴권에 대한 정신적 독립 상태. 루터의 독일어 성서 번역과 교리로 가톨릭교회에 도전했다.","프랑스: 칼뱅 추종자 위그노. 앙리 4세의 낭트칙령이 신교를 허용했지만, 폐지되면서 국가 인재가 유출됐다.","네덜란드 '새로운 예루살렘': 관용 정신으로 프랑스·이베리아에서 추방된 신교도를 포용 → 합스부르크로부터 독립 → 17세기 베스트팔렌 조약으로 공식 독립.","결과(정리 슬라이드): 신교와 종교개혁이 문화를 나눴다. 독일어권(신교)은 대중·교육 중시와 민족 정체성 형성, 로망스어권(프랑스·스페인)은 가톨릭 영향권에 남았다."]},{"heading":"서유럽 이방인들의 종교 ① 이슬람: 이민자들의 종교","pages":[18,19,20,21],"points":["유럽에게 이슬람은 반복적으로 기독교와 대립해 온 아랍 문명이다.","대립 연표: 732년 프랑스 중부에서 샤를 마르텔 군대와 전투 → 11~13세기 십자군 → 15세기 동로마 멸망으로 이슬람 유럽 침투 → 17세기 오스만 제국의 유럽 확장.","19~20세기 불평등 관계: 북아프리카가 영·프 식민지로 전락 → 1차 대전 오스만 패배 후 영·프 신탁통치 → 서유럽 승인으로 이스라엘 건국, 유럽-아랍 대결 증폭.","유럽에 이슬람인이 많은 이유: 경제적 요인, 사회적 안정을 위한 이주, 정치 불안·종교 탄압 도피, 노동자 이민 2세대의 사회통합.","서유럽에서 이슬람은 '갈등을 상징하는 존재'로 인식된다(p21 파리 이슬람 사원 사진)."]},{"heading":"프랑스의 라이시테 ① 의미·어원·역사·법 제정","pages":[22,23,24,25,26],"points":["큰 제목: '프랑스의 라이시테: 탈기독교화와 반종교주의'.","사전적 의미는 비종교성·종교 중립성·세속주의. 의미가 다양하고 번역이 어려워 학자들은 원어를 쓴다.","어원: 그리스어 라이코스(laikos, 민중) → 중세 라익(laic, 성직자가 아닌 세례받은 일반인) → 19세기 후반 '종교권력과 정치권력이 중립을 지키는 사회'로 정착.","18세기 '비판의 세기': 계몽주의 영향으로 구체제를 비판하며 프랑스 혁명이 일어났고, 귀족 대신 지성인이 정치를 맡으며 종교 문제가 사고의 핵심이 됐다.","19세기 '종교 담론의 확산': 가톨릭 방식이 비판·대체되고, 신분제 해체 속에 가톨릭·프로테스탄트 모두 제거 대상이 됐다. 급진적 혁명이 반기독교화를 고조시켰다.","법 제정(색 박스): 1801 정교협약 → 1804 민법 → 1905 라이시테법(국가 이념으로 정착, 현재 헌법으로 계승)."]},{"heading":"프랑스의 라이시테 ② 오늘날의 라이시테와 이슬람","pages":[27,28,29],"points":["오늘날 라이시테는 공화국의 기본 원칙이자, 다문화사회에서 다양성을 존중하는 통합의 논리다.","반종교적 색채도 띤다: 대형 십자가의 공공장소 전시 금지 등.","이슬람에 대한 차별과 사회적 논쟁으로 번졌다: 정교분리를 하지 않는 이슬람의 특성과 마찰.","프랑스는 유럽에서 이슬람인이 가장 많다(과거 북아프리카 출신 이민자의 지속 유입).","1989년 히잡사건 이후 라이시테 위반과 이슬람과의 충돌이 반복되고, 극우정당이 라이시테 원칙을 이용해 이슬람 문화를 비난·제한하려 한다.","p29는 SBS 뉴스 영상 캡처(유튜브 출처)뿐이고 설명이 없다. 앞 슬라이드 흐름상 라이시테·이슬람 갈등 관련 사건 보도로 추정."]},{"heading":"서유럽 이방인들의 종교 ② 유대인: 영원한 이방인","pages":[30,31,32,33,34],"points":["중세: 토지와 농업에서 배제돼 도시에서 상공업·금융업(고리대금업)을 중심으로 활동했다.","근대: 도시 발전으로 상공업·금융업이 주요 산업이 되며 역할이 커졌고, 서유럽 도시들은 유대인을 통해 번영했다. 반면 동유럽에선 포그롬(pogroms)이 잦았다.","나치의 학살 정책: 유대인의 혈통과 민족을 완전히 소멸시키려는 계획이 프랑스에서 폴란드까지 대륙 전역에서 실행됐다.","프랑스의 반감: 19세기 말 드레퓌스 사건, 2차 대전 중 비시정부가 유대인을 체포해 나치에 넘긴 일.","드레퓌스 사건(빨간 박스): 군국주의·반유대주의·강박적 애국주의 속에 포병대위 드레퓌스가 간첩 누명을 썼고, 사회가 드레퓌스파와 반드레퓌스파로 갈라졌다. 국가권력에 의한 인권유린·간첩 조작 사건이다.","전후: 학살 규모가 드러나고 독일은 유대인 차별 금지법을 도입했으며, 유대인들은 안전을 찾아 이스라엘로 이주했다(1948~1950 이민 지도).","영국의 포용: 1656년 크롬웰의 유대인 귀환 허용 → 충성·군사모집 참여, 1855년 유대인 출신 런던 시장, 1874년 유대인 출신 수상 디스레일리 → 영국 문화에 흡수."]}],"keywords":[{"term":"서유럽의 '국교 없음'","def":"서유럽 국가들은 국가 종교를 두지 않는다. 다만 국가와 종교의 관계 방식은 나라마다 다르다.","detail":"영국: 잉글랜드 국교회(성공회)는 종교단체 / 독일: 국가와 교회는 행정적으로 무관 / 프랑스: 반종교적 정책(라이시테, 정교분리). 성공회는 '국교회'라는 이름과 국왕 수장 제도가 남아 있지만 국민에게 신앙을 강제하지 않는다 (보충)","pages":[5],"memo":false,"importance":2},{"term":"기독교를 선택한 이유","def":"서유럽인들이 기독교를 받아들인 이유는 짧은 평균 수명(영생 신앙)과 정치적 이유(로마 황제의 통치 수단) 두 가지다.","detail":"영원한 생명에 대한 믿음 / 황제들이 제국 안정 유지에 활용 / 콘스탄티누스의 '비잔틴 제국 정복'으로 동쪽 확장(슬라이드 표현) / 로마 카타콤: 부활 신앙으로 화장보다 매장 선호. 콘스탄티누스는 313년 밀라노 칙령으로 기독교 공인, 330년 비잔티움 천도 (보충)","pages":[6,7],"memo":false,"importance":3},{"term":"교황의 군주 역할(이탈리아)","def":"로마제국 붕괴 후 무너진 정치 질서의 자리를 가톨릭 종교 질서가 채웠고, 교황이 중앙조직의 수장으로 기능했다.","detail":"5~19세기 이탈리아의 중심성 지속 → 교황이 군주 역할을 하며 통일 국가 건설을 방해. 이탈리아 통일은 1861년 왕국 성립, 1870년 로마 병합으로 완성 (보충)","pages":[8],"memo":false,"importance":3},{"term":"기독교의 중요한 영지, 프랑스","def":"프랑스는 왕의 개종부터 이슬람 격퇴, 십자군, 교황청 이전까지 서유럽 기독교사의 핵심 무대였다.","detail":"6세기 클로비스 왕(프랑크 왕국) 가톨릭 개종 → 8세기 샤를 마르텔, 푸아티에 전투에서 이슬람 격퇴(732년, p18) → 13세기 루이 9세 십자군 참여 → 14세기 교황이 남부 아비뇽으로 이전(아비뇽 유수). 클로비스 개종은 496년경, 아비뇽 유수는 1309~1377년 (보충)","pages":[9,18],"memo":false,"importance":3},{"term":"레콩키스타(Reconquista)","def":"8~15세기 스페인·포르투갈이 이슬람 지배에 맞서 벌인 투쟁(재정복)으로, 이 과정에서 기독교적 정체성이 확립됐다.","detail":"기독교 뿌리 + 이슬람 지배 경험 → 투쟁 속 기독교 정체성 설정 → 스페인은 15세기 재정복 완성 후 '카톨릭 왕국' 명칭 획득, 이탈리아 내정에도 깊이 관여. 1492년 그라나다 함락으로 완성 (보충)","pages":[10],"memo":false,"importance":3},{"term":"산티아고 데 콤포스텔라","def":"스페인의 재정복 완성 후 서유럽 최고의 성지순례지로 떠오른 도시다.","detail":"p11 사진: 성지 순례 행렬, 산티아고 데 콤포스텔라 대성당. 성 야고보(스페인어 산티아고)의 무덤이 있다고 전해지며 순례길 '카미노 데 산티아고'의 종착지 (보충)","pages":[10,11],"memo":false,"importance":2},{"term":"11세기 동서분열","def":"기독교가 서로마 지역의 가톨릭과 동로마 지역의 동방정교로 갈라진 첫 번째 큰 분열이다.","detail":"서: 가톨릭 — 게르만족의 기독교 개종, 교황에 대한 종교적 충성 경쟁 / 동: 동방정교 — 황제교황주의 전통(15세기까지). 1054년 교황과 콘스탄티노폴리스 총대주교의 상호 파문으로 공식화 (보충)","pages":[12],"memo":false,"importance":3},{"term":"황제교황주의(caesaropapism)","def":"동로마 지역 동방정교에서 확립돼 15세기까지 유지된 전통이다. 황제가 교회의 최고 권위까지 겸하는 체제를 뜻한다 (보충)","detail":"교황에 대한 충성을 다툰 서방 가톨릭과 대비되는 동방의 특징. 15세기까지 = 1453년 동로마(비잔틴) 제국 멸망까지 (보충)","pages":[12],"memo":false,"importance":3},{"term":"16세기 남북분열(종교개혁)","def":"16세기 가톨릭에 맞선 프로테스탄트(신교)가 탄생하며 기독교가 다시 갈라진 두 번째 큰 분열이다.","detail":"주역: 독일 루터 · 스위스 칼뱅 · 영국 헨리 8세 / 결과: 영국 성공회, 독일의 정신적 독립, 프랑스 위그노와 낭트칙령, 네덜란드 독립 / 강조 박스: '유럽 기독교의 역사는 분열과 갈등의 과정'","pages":[13,15,16,17],"memo":false,"importance":3},{"term":"마르틴 루터","def":"독일의 종교개혁가로, 가톨릭교회의 면죄부 판매를 비판하며 프로테스탄트 탄생을 이끌었다.","detail":"독일어 성서 번역과 교리로 가톨릭교회에 도전 → 독일이 라틴권으로부터 정신적으로 독립. 1517년 비텐베르크에서 95개조 반박문 발표 (보충)","pages":[13,14,15],"memo":false,"importance":3},{"term":"장 칼뱅과 위그노","def":"스위스의 장 칼뱅이 기존 가톨릭교회를 비판했고, 프랑스의 칼뱅 추종자들을 위그노라 부른다.","detail":"위그노는 앙리 4세의 낭트칙령으로 허용됐다가 칙령 폐지 후 국외로 빠져나감(국가 인재 유출). 칼뱅은 제네바에서 개혁을 이끌었고 예정설로 유명 (보충)","pages":[13,14,15],"memo":false,"importance":2},{"term":"헨리 8세와 성공회","def":"영국의 헨리 8세가 자신의 이혼·재혼 문제를 계기로 가톨릭에서 떨어져 나와 성공회를 세웠다.","detail":"영국 = '현지화된 가톨릭교회' / 가톨릭교회 재산 몰수로 국가재정에 도움 / 오늘날 성공회는 종교단체(p5). 1534년 수장령으로 국왕이 교회 수장이 됨 (보충)","pages":[5,13,14,15],"memo":false,"importance":3},{"term":"낭트칙령","def":"프랑스 앙리 4세가 신교도(위그노)의 종교를 허용한 칙령이다. 이후 폐지되면서 국가 인재가 해외로 빠져나갔다.","detail":"1598년 공포, 1685년 루이 14세가 폐지 → 위그노가 네덜란드·영국·프로이센 등으로 망명 (보충)","pages":[15],"memo":false,"importance":3},{"term":"네덜란드, '새로운 예루살렘'","def":"관용의 정신으로 프랑스와 이베리아에서 추방된 프로테스탄트를 받아들인 네덜란드를 가리킨다.","detail":"신교도 포용 → 합스부르크 왕가 지배로부터 독립하는 데 결정적 역할 → 17세기 베스트팔렌 조약으로 공식 독립 선언. 베스트팔렌 조약은 1648년, 30년 전쟁을 끝낸 조약 (보충)","pages":[16],"memo":false,"importance":3},{"term":"독일어권 vs 로망스어권","def":"신교의 등장과 종교개혁이 유럽 문화를 두 갈래로 나누고 서로 다른 사회를 만들었다(정리 슬라이드).","detail":"독일어권(프로테스탄트): 대중 중시, 교육을 통한 사회변화 촉진, 근대 국가의 민족 정체성 형성에 결정적 / 로망스어권(프랑스·스페인 등): 여전히 가톨릭교회의 영향권","pages":[17],"memo":false,"importance":3},{"term":"이슬람: 이민자들의 종교","def":"유럽에게 이슬람은 반복적으로 기독교와 대립해 온 아랍 문명이며, 오늘날 서유럽에서는 주로 이민자의 종교다.","detail":"732년 프랑스 중부 샤를 마르텔 군대와 전투 → 11~13세기 십자군 원정 → 15세기 동로마 제국 멸망으로 이슬람의 유럽 침투 → 17세기 오스만 제국 성장으로 이슬람 세력 확장. 동로마 멸망은 1453년, 오스만의 2차 빈 포위는 1683년 (보충)","pages":[18],"memo":false,"importance":3},{"term":"19~20세기 불평등 관계","def":"19~20세기에 유럽과 이슬람(아랍) 세계는 지배와 피지배의 불평등한 관계가 됐다.","detail":"19세기 북아프리카가 영국·프랑스 식민지로 전락 → 1차 대전 오스만 제국 패배로 영·프 신탁통치 지역화 → 서유럽 승인으로 유대인 국가 이스라엘 건국 → 유럽-아랍 대결 증폭. 이스라엘 건국은 1948년 (보충)","pages":[19],"memo":false,"importance":3},{"term":"유럽에 이슬람인이 많은 이유","def":"경제·사회·정치적 이유로 이슬람권 사람들이 유럽으로 이주했고, 이민 2세대의 통합이 과제가 됐다.","detail":"① 경제적 요인 ② 사회적 안정을 위한 이주 ③ 정치적 불안정과 종교적 탄압으로부터 도피 ④ 유입된 노동자들의 이민 2세대의 유럽 사회통합 / 서유럽에서 이슬람은 '갈등을 상징하는 존재'로 인식(p21 파리 이슬람 사원)","pages":[20,21],"memo":false,"importance":2},{"term":"라이시테(laïcité)","def":"프랑스의 정교분리 원칙으로, 사전적 의미는 비종교성·종교 중립성·세속주의다.","detail":"의미가 다양하고 번역어로 전달하기 어려워 학자들은 원어를 그대로 씀 / 단원 제목: '탈기독교화와 반종교주의' / p5에서 '프랑스: 반종교적 정책'으로 소개","pages":[5,22],"memo":false,"importance":3},{"term":"라이시테의 어원","def":"'민중'을 뜻하는 그리스어에서 출발해, 19세기 후반 '종교와 정치 권력이 중립을 지키는 사회'라는 개념으로 정착했다.","detail":"그리스어 라이코스(laikos): 민중 → 중세 라익(laic): 성직자가 아닌 세례 받은 일반인 → 19세기 후반: 종교권력과 정치권력이 중립을 지키는 사회","pages":[23],"memo":false,"importance":3},{"term":"18~19세기 라이시테의 형성","def":"18세기 계몽주의 비판에서 시작해 19세기 반기독교화로 이어진 흐름이 라이시테의 토대가 됐다.","detail":"18세기 '비판의 세기': 계몽주의 → 구체제 비판 → 프랑스 혁명, 귀족 대신 지성인이 정치, 종교 문제가 사고의 핵심 / 19세기 '종교 담론의 확산': 가톨릭 방식 비판·대체, 신분제 해체 속 가톨릭·프로테스탄트 모두 제거 대상, 급진적 혁명이 반기독교화 고조. 프랑스 혁명은 1789년 (보충)","pages":[24,25],"memo":false,"importance":2},{"term":"1801년 정교협약","def":"나폴레옹과 교황 비오 7세가 맺은 협약으로, 가톨릭 국교 국가였던 프랑스를 여러 종교가 공존하는 국가로 바꿨다.","detail":"신부들은 정부로부터 급여를 받는 신분으로 전환 / 법 제정 3단계의 첫 단계. 프랑스어로 콩코르다(Concordat) (보충)","pages":[26],"memo":false,"importance":3},{"term":"1804년 민법","def":"프랑스의 행정체계를 교회 중심에서 국가 행정으로 바꾼 법이다.","detail":"1801 정교협약 다음 단계. 흔히 '나폴레옹 법전'이라 부름 (보충)","pages":[26],"memo":false,"importance":2},{"term":"1905년 라이시테법","def":"라이시테를 국가 이념으로 정착시킨 법으로, 그 정신이 현재 헌법으로 계승됐다.","detail":"법 제정 3단계의 완성: 1801 정교협약 → 1804 민법 → 1905 라이시테법. 정식 명칭은 '교회와 국가의 분리에 관한 법'이고, 1958년 헌법 제1조가 프랑스를 '비종교적(laïque) 공화국'으로 규정 (보충)","pages":[26],"memo":false,"importance":3},{"term":"오늘날의 라이시테","def":"공화국의 기본 원칙이자 다문화사회에서 다양성을 존중하는 통합의 논리다. 동시에 반종교적 색채를 띠어 이슬람과 마찰을 빚는다.","detail":"예: 대형 십자가의 공공장소 전시 금지 / 이슬람에 대한 차별과 사회적 논쟁으로 발전 — 정교분리를 하지 않는 이슬람의 특성과 마찰","pages":[27],"memo":false,"importance":3},{"term":"1989년 히잡사건","def":"이후 프랑스에서 라이시테 위반 논란과 이슬람과의 충돌이 반복되는 출발점이 된 사건이다.","detail":"배경: 유럽에서 이슬람인이 가장 많은 프랑스(과거 북아프리카 출신 이민자의 지속 유입) / 이후: 극우정당이 라이시테 원칙을 이용해 이슬람 문화 비난·제한 시도. 크레이(Creil)의 공립 중학교가 히잡을 쓴 무슬림 여학생들의 수업 참여를 막은 사건이고, 2004년 공립학교 종교 상징물 착용 금지법으로 이어짐 (보충)","pages":[28],"memo":false,"importance":3},{"term":"유대인: 영원한 이방인 / 포그롬","def":"유대인은 중세부터 토지·농업에서 배제돼 도시의 상공업·금융업에 종사했고, 근대 서유럽 도시 번영에 기여했지만 늘 이방인으로 취급됐다.","detail":"중세: 토지·농업에서 배제 → 도시 상공업·금융업(고리대금업) / 근대: 도시 발전으로 상공업·금융업이 주요 산업, 서유럽 도시들이 유대인을 통해 번영 / 동유럽: 유대인 집단학살 포그롬(pogroms) 빈발","pages":[30],"memo":false,"importance":3},{"term":"드레퓌스 사건","def":"19세기 말 프랑스 포병대위 드레퓌스가 간첩 누명을 쓰고 옥살이를 한 사건으로, 사회가 드레퓌스파(무죄)와 반드레퓌스파(유죄)로 갈라져 격렬하게 싸운 정치 스캔들이다.","detail":"배경: 군국주의·반유대주의·강박적 애국주의 / 국가권력에 의한 대표적 인권유린·간첩 조작 사건 / 그림: 1895년 1월 5일 드레퓌스 해임식(르 프티 주르날 1895.1.13, 앙리 메예 '반역자'). 1894년 체포, 1898년 에밀 졸라 '나는 고발한다', 1906년 무죄 복권 (보충)","pages":[31,32],"memo":false,"importance":3},{"term":"나치 학살·비시정부와 이스라엘 이주","def":"나치는 유대인의 혈통과 민족을 완전히 없애려 했고, 프랑스 비시정부는 유대인을 체포해 나치에 넘겼다. 전쟁 후 유대인들은 안전을 찾아 이스라엘로 이주했다.","detail":"학살은 프랑스에서 폴란드까지 대륙 전역 / 2차 대전 종식 후 학살 규모 드러남 → 독일 유대인 차별 금지법 도입 → 이스라엘 이주 결정 / p33 지도(1948~1950): 연간 약 12만(1948)·24만(1949)·17만(1950)명. 나치의 유대인 학살을 홀로코스트라 부름 (보충)","pages":[31,33],"memo":false,"importance":2},{"term":"영국의 유대인 포용","def":"영국은 유대인을 받아들여 사회에 흡수한 대표적 사례다.","detail":"1656년 크롬웰이 유대인 귀환 허용 → 유대인들이 충성심을 보이며 군사모집 참여 / 1855년 유대인 출신 런던 시장 당선 / 1874년 유대인 출신 수상 벤저민 디스레일리 당선 / 유대인들이 영국 문화에 흡수되어 살아감","pages":[34],"memo":false,"importance":3}],"memos":[],"questions":[{"q":"'유럽 기독교의 역사는 분열과 갈등의 과정'이라는 관점에서 11세기 동서분열과 16세기 남북분열의 내용과 결과를 설명하시오.","likelihood":3,"why":"p12~17 여섯 장에 같은 강조 박스 문구가 반복되고, 학습목표 01(기독교와 종교 분열의 역사)과 직접 연결된다. 동서·남북 두 축이라 비교 서술형으로 내기 좋다.","outline":["서론: 강조 박스 '유럽 기독교의 역사는 분열과 갈등의 과정' 인용 → 두 번의 큰 분열(11세기 동서, 16세기 남북) 제시","본론 ①: 11세기 동서분열 — 서로마 가톨릭(게르만족 개종, 교황에 대한 충성 경쟁) vs 동로마 동방정교(15세기까지 황제교황주의)","본론 ②: 16세기 남북분열 — 루터(면죄부 판매 비판), 칼뱅(가톨릭 비판), 헨리 8세(성공회 설립)로 프로테스탄트 탄생","본론 ③: 나라별 전개 — 영국(이혼·재혼 문제, 교회 재산 몰수), 독일(독일어 성서, 라틴권에서 정신적 독립), 프랑스(위그노, 낭트칙령과 폐지로 인재 유출), 네덜란드(관용, 베스트팔렌 조약으로 독립)","결론: 분열이 문화를 갈랐다 — 독일어권(교육·민족 정체성) vs 로망스어권(가톨릭 영향권)"],"mustKeywords":["동서분열","가톨릭 vs 동방정교","황제교황주의(caesaropapism)","남북분열·프로테스탄트","루터의 면죄부 비판","헨리 8세·성공회","낭트칙령·위그노","독일어권 vs 로망스어권"],"pages":[12,13,14,15,16,17]},{"q":"프랑스 라이시테(laïcité)의 의미와 어원을 설명하고, 18세기부터 1905년 라이시테법 제정까지의 형성 과정을 서술하시오.","likelihood":3,"why":"학습목표 02의 핵심 개념이고 라이시테 파트가 8장(p22~29)으로 가장 크다. 단원 제목 '탈기독교화와 반종교주의'와 색 박스로 강조된 '라이시테에 관한 법 제정' 연표(1801→1804→1905)가 그대로 답안 뼈대가 된다.","outline":["서론: 사전적 의미(비종교성·종교 중립성·세속주의), 번역이 어려워 원어를 그대로 씀","본론 ① 어원: 그리스어 laikos(민중) → 중세 laic(성직자 아닌 세례받은 일반인) → 19세기 후반 '종교권력과 정치권력이 중립을 지키는 사회'","본론 ② 18세기 비판의 세기: 계몽주의 → 구체제 비판 → 프랑스 혁명, 지성인 정치, 종교 문제가 사고의 핵심","본론 ③ 19세기 종교 담론 확산: 가톨릭 방식 비판·대체, 신분제 해체 속 가톨릭·프로테스탄트 모두 제거 대상, 반기독교화 고조","본론 ④ 법 제정: 1801 정교협약(다종교 국가, 신부=정부 급여) → 1804 민법(행정이 교회에서 국가로) → 1905 라이시테법(국가 이념, 현 헌법 계승)","결론: 라이시테는 탈기독교화의 결과이자 오늘날 프랑스 공화국의 기본 원칙"],"mustKeywords":["laïcité","비종교성·종교 중립성·세속주의","laikos·laic","계몽주의·프랑스 혁명","1801 정교협약(나폴레옹·비오 7세)","1804 민법","1905 라이시테법","헌법 계승"],"pages":[22,23,24,25,26]},{"q":"오늘날 프랑스에서 라이시테 원칙과 이슬람이 갈등하는 원인과 전개 과정을 역사적 배경과 함께 설명하시오.","likelihood":3,"why":"학습목표 02가 '이슬람과의 갈등 원인을 이해하기 위한 라이시테'로 이 질문 자체를 겨냥한다. 오늘날의 라이시테(p27~28)와 이슬람 파트(p18~21), 뉴스 영상(p29)이 모두 이 결론으로 모인다.","outline":["서론: 오늘날 라이시테 = 공화국 기본 원칙, 다문화사회에서 다양성을 존중하는 통합의 논리","본론 ① 역사적 대립: 732년 샤를 마르텔과의 전투 → 십자군 → 동로마 멸망 → 오스만 확장 / 19~20세기 식민지·신탁통치·이스라엘 건국으로 불평등 관계","본론 ② 이민: 프랑스는 유럽에서 이슬람인이 가장 많음(북아프리카 출신 이민 지속 유입). 이주 이유는 경제, 사회적 안정, 정치 불안·종교 탄압 도피, 2세대 통합","본론 ③ 갈등 원인: 라이시테의 반종교적 색채(대형 십자가 공공 전시 금지) vs 정교분리를 하지 않는 이슬람의 특성","본론 ④ 전개: 1989 히잡사건 이후 라이시테 위반·충돌 반복, 극우정당이 라이시테를 이용해 이슬람 문화 비난·제한","결론: 통합 원리였던 라이시테가 차별 논쟁으로 번짐 → 서유럽에서 이슬람은 '갈등을 상징하는 존재'로 인식"],"mustKeywords":["공화국 기본 원칙·통합의 논리","반종교적 색채","정교분리를 하지 않는 이슬람","북아프리카 이민","1989 히잡사건","극우정당","식민지·신탁통치","갈등의 상징"],"pages":[18,19,20,21,27,28,29]},{"q":"유대인이 서유럽에서 '영원한 이방인'으로 불린 이유를 중세의 경제 활동, 근대 이후의 박해, 나라별 대응(프랑스·독일·영국)을 중심으로 설명하시오.","likelihood":3,"why":"학습목표 03(유럽 소수자의 종교)의 한 축이다. '유대인: 영원한 이방인' 소제목이 5장(p30~34)에 반복되고, 드레퓌스 사건은 빨간 박스 정의 슬라이드(p32)로 따로 강조됐다.","outline":["서론: 유대인 = 서유럽의 '영원한 이방인'","본론 ① 중세: 토지·농업에서 배제 → 도시에서 상공업·금융업(고리대금업)","본론 ② 근대: 도시 발전으로 상공업·금융업이 주요 산업 → 서유럽 도시 번영에 기여 / 동유럽은 포그롬 빈발","본론 ③ 박해: 나치의 학살 정책(프랑스~폴란드), 프랑스의 반감(19세기 말 드레퓌스 사건, 비시정부의 유대인 인도)","본론 ④ 전후와 포용: 학살 규모 드러남 → 독일 차별 금지법, 이스라엘 이주 / 영국은 1656 크롬웰 귀환 허용, 1855 유대인 런던 시장, 1874 디스레일리 수상","결론: 경제적으로는 필요했지만 종교·민족적으로 배제된 존재 — 나라마다 배제와 포용이 엇갈렸다"],"mustKeywords":["영원한 이방인","토지·농업 배제","금융업·고리대금업","포그롬(pogroms)","나치 학살","드레퓌스 사건","비시정부","크롬웰·디스레일리"],"pages":[30,31,32,33,34]},{"q":"서유럽인들이 기독교를 받아들인 이유를 설명하고, 로마제국 붕괴 이후 이탈리아·프랑스·스페인에서 기독교가 한 역할을 서술하시오.","likelihood":2,"why":"'유럽인들의 믿음, 기독교' 단원 6장(p6~11). 수용 이유 2가지와 나라별 연표형 정리가 분명해 서술형으로 묻기 쉽다.","outline":["서론: 수용 이유 ① 짧은 평균 수명 → 영생 신앙(카타콤 매장) ② 정치: 로마 황제들이 제국 안정에 활용, 콘스탄티누스 이후 동쪽 확장","본론 ① 이탈리아: 붕괴된 정치 질서를 종교 질서가 대체, 교황=중앙조직 수장 → 5~19세기 교황의 군주 역할이 통일을 방해","본론 ② 프랑스(기독교의 영지): 6세기 클로비스 개종 → 8세기 샤를 마르텔 푸아티에 전투 → 13세기 루이 9세 십자군 → 14세기 아비뇽 유수","본론 ③ 스페인·포르투갈: 8~15세기 레콩키스타로 기독교 정체성 형성 → 15세기 '카톨릭 왕국' 명칭, 산티아고 데 콤포스텔라가 최고 순례지","결론: 기독교는 신앙을 넘어 정치 질서와 국가 정체성의 뼈대가 됐다"],"mustKeywords":["영원한 생명","로마 황제의 통치 수단","교황의 군주 역할","클로비스","샤를 마르텔·푸아티에","아비뇽 유수","레콩키스타","산티아고 데 콤포스텔라"],"pages":[6,7,8,9,10,11]},{"q":"오늘날 서유럽 국가에는 국교가 없다. 영국·독일·프랑스의 국가와 종교의 관계를 비교하고, 각각이 형성된 역사적 배경을 설명하시오.","likelihood":2,"why":"도입 슬라이드(p5)가 세 나라를 한 줄씩 대비해 비교형 문제로 만들기 쉽다. 16세기 나라별 분열(p15)과 라이시테(p22~26)를 엮는 종합형이다.","outline":["서론: 서유럽 국가에는 국교가 없음(p5) — 그러나 국가와 종교의 관계 방식은 나라마다 다름","본론 ① 영국: 성공회는 종교단체 — 배경: 헨리 8세의 이혼·재혼 문제로 성공회 설립, 가톨릭 재산 몰수(현지화된 가톨릭)","본론 ② 독일: 국가와 교회는 행정적으로 무관 — 배경: 루터의 종교개혁, 라틴권으로부터 정신적 독립, 교육·민족 정체성","본론 ③ 프랑스: 반종교적 정책(라이시테) — 배경: 계몽주의·혁명의 반기독교화 → 1801 정교협약·1804 민법·1905 라이시테법","결론: 종교개혁과 세속화가 나라마다 다른 길을 걸어 오늘날 국가-종교 관계의 차이를 만들었다"],"mustKeywords":["국교 없음","성공회=종교단체","헨리 8세","국가·교회 행정적 무관","루터","라이시테","1905 라이시테법","정교분리"],"pages":[5,13,15,22,26]}],"a4":["분열 2단계: 11C 동서분열(서=가톨릭·교황 충성 경쟁 / 동=동방정교·황제교황주의 caesaropapism, ~15C) → 16C 남북분열(프로테스탄트 탄생). 동서분열 공식화는 1054년 (보충)","종교개혁 3인: 루터(독일, 면죄부 판매 비판·독일어 성서) / 칼뱅(스위스, 프랑스 추종자=위그노) / 헨리 8세(영국, 이혼·재혼 → 성공회, 교회 재산 몰수로 재정 확충)","낭트칙령(앙리 4세): 신교(위그노) 허용 → 폐지로 국가 인재 유출. 1598 공포·1685 루이 14세 폐지 (보충)","네덜란드 '새로운 예루살렘': 관용 → 추방된 신교도 포용 → 합스부르크로부터 독립 → 17C 베스트팔렌 조약으로 공식 독립. 조약은 1648년 (보충)","문화 분화(p17): 독일어권=신교, 대중·교육 통한 사회변화, 근대 민족 정체성 / 로망스어권(프랑스·스페인)=여전히 가톨릭 영향권","기독교 수용 이유: ① 짧은 평균 수명 → 영생 신앙(카타콤: 부활 믿음으로 매장 선호) ② 로마 황제의 제국 안정 수단, 콘스탄티누스 → 동쪽 확장","이탈리아: 로마 붕괴 후 교황=중앙조직 수장, 5~19C 이탈리아 중심성 → 교황의 군주 역할이 통일 국가 건설 방해","프랑스=기독교의 영지: 6C 클로비스 개종 → 8C 샤를 마르텔 푸아티에 전투(732) 이슬람 격퇴 → 13C 루이 9세 십자군 → 14C 아비뇽 유수","이베리아: 레콩키스타(Reconquista, 8~15C) → 기독교 정체성 → 스페인 '카톨릭 왕국' 명칭 → 산티아고 데 콤포스텔라 최고 순례지, 이탈리아 내정 관여","국교 없음(p5): 영국 성공회=종교단체 / 독일 국가·교회 행정적 무관 / 프랑스 반종교적 정책(라이시테)","라이시테(laïcité)=비종교성·종교 중립성·세속주의(번역 어려워 원어 사용). 어원: laikos(민중) → laic(성직자 아닌 세례받은 일반인) → 19C 후반 종교·정치권력이 중립인 사회","라이시테 흐름: 18C 비판의 세기(계몽주의 → 구체제 비판 → 프랑스 혁명, 지성인 정치) → 19C 종교 담론 확산(가톨릭·신교 모두 제거 대상, 반기독교화)","법 3단계: 1801 정교협약(나폴레옹-교황 비오 7세: 다종교 국가, 신부=정부 급여) → 1804 민법(행정: 교회 → 국가) → 1905 라이시테법(국가 이념 → 현 헌법 계승)","오늘날 라이시테: 공화국 기본 원칙·다양성 존중 통합 논리 ↔ 반종교적 색채(대형 십자가 공공 전시 금지), 정교분리 안 하는 이슬람과 마찰","라이시테-이슬람 갈등: 프랑스=유럽 최다 이슬람인(북아프리카 이민) → 1989 히잡사건 이후 충돌 반복 → 극우정당이 라이시테로 이슬람 문화 비난·제한","이슬람 대립사: 732 샤를 마르텔 전투 → 11~13C 십자군 → 15C 동로마 멸망 → 17C 오스만 확장 → 19C 북아프리카 영·프 식민지 → 1차대전 후 영·프 신탁통치 → 이스라엘 건국","이슬람 이주 이유: 경제 / 사회적 안정 / 정치 불안·종교 탄압 도피 / 노동이민 2세대 사회통합 → 서유럽에서 '갈등을 상징하는 존재'","유대인=영원한 이방인: 중세 토지·농업 배제 → 도시 상공업·금융(고리대금) → 근대 서유럽 도시 번영 / 동유럽 포그롬(pogroms)","드레퓌스 사건(19C 말): 포병대위 간첩 누명, 군국주의·반유대주의·강박적 애국주의, 드레퓌스파 vs 반드레퓌스파, 국가권력의 인권유린·간첩 조작 / 1895.1.5 해임식","박해와 포용: 나치 학살(프랑스~폴란드)·비시정부 유대인 인도 → 전후 독일 차별 금지법·이스라엘 이주(1948~50) / 영국: 1656 크롬웰 귀환 허용, 1855 유대인 런던 시장, 1874 디스레일리 수상"],"links":["2주차 예술사조: 도입 사진의 대성당(파리 노트르담·쾰른·밀라노=고딕, 런던 세인트 폴=바로크)은 종교가 건축 양식을 이끈 사례로 엮을 수 있다 (보충)","3주차 대학: 교회 질서 속에서 성장한 중세 대학과 종교개혁 후 독일어권의 '교육을 통한 사회변화'(p17)를 '교육 주도권의 이동'으로 연결할 수 있다 (보충)","6주차 카페: 18세기 '비판의 세기'(p24) 계몽주의 지식인 토론은 카페·살롱 공론장과 같은 시대로, 혁명·라이시테 사상의 배경이 된다 (보충)","7주차 영화: 드레퓌스 사건은 영화 「장교와 스파이」(2019)로 만들어졌다. 종교·소수자 문제를 영화 사례로 연결할 수 있다 (보충)"],"memoTitle":"내 메모","memoHint":"PDF에 직접 적은 것","memoTag":"내 메모","short":"종교","pageCount":35},{"week":6,"title":"카페","oneLiner":"서유럽 카페는 커피보다 토론을 나누며 혁명·저널리즘·예술을 낳은 사회적 공간","bigQuestion":"서유럽의 카페는 왜 커피를 마시는 곳을 넘어 토론과 사상·예술이 탄생하는 사회적 공간이 되었는가?","flow":["도입: 영국 의회 토론·마크롱의 시민 설득·독일 초등학생 시위 영상으로 서유럽의 일상화된 토론 문화를 보여 줌.","말하기 전통: 고대 아고라 → 수사학 중심 사교 문화 → 프랑스 살롱(오네톰) → 영국 신사 클럽 → 카페로 이어짐.","기원: 1475년 콘스탄티노플의 '키바 한'이 최초의 카페, 1529년 오스만 제국의 오스트리아 침공으로 유럽에 커피 전파(17세기 커피는 터키, 차는 중국에서 전래).","17세기 런던: 1650년 옥스퍼드 첫 커피하우스, 17세기에 2000개 이상 — 1페니로 누구나 토론하는 '페니 대학'이 근대 저널리즘(스펙테이터)·클럽·애프터눈 티를 낳음.","17~18세기 파리: 1686년 프로코프 개점 → 18세기 계몽사상가의 정치 담론 공간 → 당통·마라·로베스피에르가 모의한 프랑스 혁명의 기폭제.","19세기: 카페가 유럽 전역의 사교 중심지이자 예술가·문학가의 장소가 됨 — 빈 카페 첸트랄, 베네치아 카페 플로리안, 혁명 후 문학 카페로 돌아간 프로코프.","19~20세기 파리: 오스만의 개혁 이후 몽마르트르·몽파르나스의 예술가 카페 → 2차 세계대전 후 생제르맹데프레의 카페 드 플로르·레 되마고(사르트르·보부아르의 실존주의).","베를린: 1721년 위그노의 커피하우스 → 1898년 베스텐스 → 1920년대 로마니셰스 카페(바이마르의 '창조의 실험장') → 나치의 탄압·파괴 → 1970년대 말 카페 아인슈타인으로 부활. 20세기에는 스타벅스 등 프랜차이즈가 들어옴.","마무리 질문: 서유럽 카페는 '대화의 공간', 한국 카페는 카공족의 '개인 작업 공간' — 이 차이는 어디서 오는가?"],"sections":[{"heading":"개요: 학습 내용·참고 문헌","pages":[1,2,3],"points":["학습 내용 4개: ① 유럽의 카페란 ② 이야기 문화의 유럽 ③ 카페의 탄생과 변천 ④ 런던·파리·베를린의 카페와 문화적 의의.","참고 문헌: 이광주 『교양의 탄생』(한길사, 2009), 이나라 『유럽 영화 운동』(한길사, 2015).","책 표지 사진으로 이광주 『담론의 탄생: 유럽의 살롱과 클럽과 카페 그 자유로운 풍경』도 함께 제시."]},{"heading":"서유럽의 토론 문화(도입 영상)","pages":[4,5,6],"points":["영국 의회: '쇼미 디스 랩 배틀보다 살벌한 토론이 벌어지는 이곳' — 의원들이 정면으로 맞붙는 토론.","프랑스: '더 일하고 더 많이 벌자' 설득에 진땀 나는 마크롱 — 대통령이 시민과 직접 논쟁.","독일: 독일 초등학생들의 시위 현장 — 'KEIN MENSCH IST ILLEGAL' 피켓을 든 아이들.","공통 메시지: 정치인부터 어린이까지 공개적으로 말하고 토론하는 문화가 일상이며, 이것이 카페 문화의 배경."]},{"heading":"유럽의 카페: 유럽 카페의 전통","pages":[7],"points":["카페는 단순히 커피를 마시는 장소가 아니라 토론하고 생각을 교환하는 장소로 기능.","17세기부터 철학자·작가·정치가가 모여 의견을 자유롭게 나누는 장소로 정착.","이 전통은 서유럽의 도시, 즉 파리·런던·베를린에서 만들어짐."]},{"heading":"말하기 문화의 서유럽","pages":[8,9],"points":["자유롭게 말하기의 전통: 고대 그리스·로마의 아고라 → 사교 문화(수사학이 인간 교양의 핵심) → 근대 살롱 문화 → 영국 신사계급의 클럽 형성.","근대 살롱 문화 속에서 프랑스의 교양인 '오네톰'이 탄생하고 길러짐.","19세기 유럽의 카페는 유럽 전역에서 사교의 중심지로 정착했고, 18세기 파리에서 시작된 카페 문화가 그 토대.","파리에서 카페가 발전한 이유: 프랑스의 사교적인 문화 — 개인주의적인 영국 문화, 관념적인 독일 문화와 다름."]},{"heading":"서유럽의 카페: 카페의 역할과 상징","pages":[10,11,12],"points":["파리: 프랑스 혁명과 계몽주의 시대에 중요한 역할, 정치·사회 문제에 대한 열띤 토론의 장소.","런던: 금융과 상업의 중심지로서 경제와 정치에 관한 중요한 논의.","베를린: 문학과 철학의 중심지로서 예술가와 사상가들이 모인 장소.","영상(YTN 사이언스): '프랑스, 반년 만에 야외 카페 문 열던 날' — 코로나19 봉쇄 뒤 테라스 카페가 다시 문을 연 소식(보충).","서유럽의 상징인 카페 3단계: 17세기 커피(터키 경유)·차(중국) 전래 → 카페 문화 형성(17~18세기 도시는 자유로운 소통이 가능한 곳, 남성들이 가정을 벗어나 자유롭게 만나는 곳) → 중요한 사회적 공간으로 정착."]},{"heading":"서유럽 카페의 탄생과 변천","pages":[13,14,15,16,17,18,19,20],"points":["최초의 카페: 1475년 키바 한(Kiva Han) — 오스만 제국의 수도 콘스탄티노플에 개점. 15세기 오스만 제국은 번성한 문화의 중심지였고 커피 인기가 매우 높았음.","1529년 오스만 제국의 오스트리아 침공으로 유럽에 커피가 전파됨.","영국에서 커피하우스 탄생: 1650년 옥스퍼드에서 최초의 커피하우스 개점, 17세기에 2000개 넘게 존재.","영국 커피하우스 = '페니 대학': 1페니를 내면 오래 머무르며 누구나 의견을 표현·교환하는 곳이자 사회적 비판의 장.","18세기 프랑스 전성기: 은밀한 가십이 퍼지는 장소 / 학문적인 토론의 장소 / 정치적 인사들의 모임 장소.","19세기 변화 — 많은 예술가·문학가에게 사랑받는 장소: 빈 카페 첸트랄(1867 개점, 프로이트·히틀러·스탈린), 베네치아 카페 플로리안(유럽 최초의 문학 카페, 루소·괴테·스탕달), 19세기 후반 파리의 카페(헤밍웨이·피카소·사르트르·카뮈).","20세기 프랜차이즈 카페의 유입: 파리의 스타벅스, 베를린의 스타벅스."]},{"heading":"서유럽 국가들의 카페: 국민 음료","pages":[21],"points":["유럽 각국의 국민 음료는 각 나라의 특성을 반영.","프랑스의 포도주: 온화한 기후와 풍부한 포도 재배.","독일의 맥주: 역사가 긴 규제를 통한 독일인의 철저함과 전통.","영국의 홍차: 영국인의 정통성과 차분함."]},{"heading":"서유럽 도시들의 카페: 런던","pages":[22,23,24,25],"points":["영국 커피하우스의 흐름: 펍의 성행(음식이 맛없던 영국에서 술로 배를 채움, 맥주를 많이 마심) → 자본주의 선도(시민사회 실현으로 차 문화 발달) → 1650년 최초의 커피하우스 → 홍차의 보급 → 문학 커피하우스의 탄생.","1650년 커피하우스 설립: 커피무역을 독점한 사람들 때문에 '카페'보다 '커피하우스'라는 이름이 자리 잡음.","홍차 보급기: 펍을 능가할 만큼 커피하우스가 늘고, 지식인과 전문직 종사자의 모임 장소가 됨. 이후 펍을 즐기던 문인·배우가 드나드는 문학 커피하우스가 생겨 영국 클럽의 기원이 됨.","19세기 보헤미안 시대: 화가·시인들이 커피하우스를 단골로 드나듦 — 상징파 화가 제임스 휘슬러, 대표 문예 커피하우스 '카페 로열', 팁의 풍습(to insure promptness → tip) 등장.","커피하우스가 만든 문화 ① 애프터눈 티: 집에 손님을 초대해 정원에서 차를 마시는 것이 예의, 여주인 중심의 사교 문화, 오후 4~6시(영상: 애프터눈 티 문화의 유래, 런던 리치몬드의 애프터눈 티 카페).","커피하우스가 만든 문화 ② 근대 저널리즘의 요람: 유럽 최초의 일간지 '스펙테이터' 발족. 신문·잡지 편집자가 정보를 얻고 기사를 쓰며, 작가와 독자가 문학적 사고와 문서작성법을 배운 곳.","결과: 근대적 의회정치, 저널리즘, 근대적 소설이 발생한 곳."]},{"heading":"서유럽 도시들의 카페: 파리 ① 프로코프","pages":[26,27,28,29,30,31,32],"points":["프랑스 최초의 카페: 1686년 파리에 문을 연 '프로코프'(Café Procope).","검은 옷·팔에 걸친 흰 헝겊·은색 쟁반의 종업원 복장이 이곳에서 시작됨(p27 사진).","단골은 맞은편 코미디 프랑세즈 극장의 배우·관객. 관객이 상류층이어서 카페 손님도 대부분 부르주아 지식인.","프로코프의 의의: 초기 단골은 문인·철학자(시인 라퐁텐, 극작가 보마르셰, 독일의 비평가·시인)이고 토론 주제가 문학이어서 문학 담론의 중심지가 됨. 이후 파리 전역에 카페가 생김. 철학자 콩도르세·볼테르·디드로도 이곳에서 토론(p28 그림).","18세기: 우아한 취미를 즐기던 17세기 살롱에서 자유로운 정치 담론의 시기로 변화. 파리 시민이 카페를 통해 신분과 종파를 초월한 철학자가 됨.","프랑스 혁명의 기폭제: 계몽주의 철학자의 정신을 이어받아 에베르·당통·마라·로베스피에르가 혁명 작전을 모의. 혁명의 상징 '붉은 모자'가 처음 선보인 곳이며, 2024 파리 올림픽 마스코트도 이 자유의 모자.","혁명 이후 문학 카페로 회귀(스탕달·뮈세·발자크·위고·조르주 상드, 소르본 학생과 연인들, 파리의 풍속도) → 오늘날에는 레스토랑으로 변모."]},{"heading":"서유럽 도시들의 카페: 파리 ② 몽마르트르·몽파르나스·생제르맹데프레","pages":[33,34,35],"points":["19세기 오스만의 개혁 이후 오늘날 파리의 모습이 형성됨.","과학과 기술의 시대에 예술가들이 외면당하자, 벨에포크 시기 예술가들이 몽파르나스와 몽마르트르에 모임. 두 곳은 파리의 문화예술을 꽃피운 상징적 장소.","몽마르트르: 화가들의 예술적 교류 — 브라크·들로네·뒤샹·칸딘스키·피카소.","몽파르나스: 20세기 초 전 세계 예술가들이 모인 국제적 예술 공동체 — 라 로통드·르 돔·라 쿠폴, 피카소·모딜리아니·샤갈.","생제르맹데프레: 2차 세계대전 이후 지성의 중심이 옮겨 간 곳 — 카페 드 플로르·레 되마고, 사르트르·보부아르의 실존주의, 알베르 카뮈, 초현실주의자 앙드레 브르통(p35 오늘날의 되마고)."]},{"heading":"서유럽 도시들의 카페: 파리 ③ 카페 드 플로르","pages":[36,37,38,39,40,41,42],"points":["되마고의 라이벌 '카페 드 플로르'(Café de Flore): 1885년 개점, 되마고와 함께 파리 카페 문화를 상징.","아폴리네르와 피카소가 문예지 '파리의 저녁'을 창간했고, 앙드레 지드가 주도한 '신프랑스 평론'(1908)이 시작된 곳.","반예술적·허무적 예술운동인 다다이즘의 작가들이 찾은 곳으로, 모든 예술인을 위한 문예 살롱 역할.","생텍쥐페리·피카소·헤밍웨이·카뮈 등 세계적인 문인과 기호학자 롤랑 바르트가 단골. 계약부부 사르트르와 보부아르가 만나던 곳.","사진: 1900년대의 카페 드 플로르(p38), 오늘날의 카페 드 플로르(p39), 사르트르와 보부아르(p40).","p41(카페 바 카운터 사진)·p42(로고 영상 화면)는 설명이 없는 영상 슬라이드. p41은 p50의 '아연 카운터'와 이어지는 장면으로 추정됨."]},{"heading":"서유럽 도시들의 카페: 베를린","pages":[43,44,45,46,47,48],"points":["초창기: 1920년대 들어 카페가 유행. 독일 최초의 카페는 북해 항구에서 시작됐고, 베를린에서는 1721년 망명한 프랑스 위그노가 대중적인 커피하우스를 엶.","19세기까지: 카페는 일반 시민에게 낯선 존재였고 손님 대부분이 근위장교. 작가들은 구석에서 담론을 나눔(프로이센의 전형적인 모습). 1898년 베스텐스(Westens) 카페 개점 이후 카페 문화가 정착.","1차 대전 이후 전환점(1920년대): 베스텐스 대신 로마니셰스 카페가 중심이 됨 — 베를린 화가들의 모임 장소, 상징적 인물 칸딘스키, 신즉물주의 작가 케스텐·시인 케스트너. 케스트너의 『에밀과 탐정들』이 탄생한 곳.","파리와 다른 베를린: 1차대전 패전과 바이마르 공화국 → 전통 청산 의지인 신즉물주의·표현주의 부상(작가 브레히트·추크마이어, 미술 칸딘스키·클레). 베를린이 '창조의 실험장'이 되어 독일·소련·미국 작가와 예술가가 모임.","1920년대 후반: 보헤미안 분위기가 사라짐. 산업도시화 속에 히틀러 제3제국 군인들이 카페를 탄압했고 로마니셰스 카페가 파괴됨.","1970년대 말 부활: 카페 아인슈타인(대표 메뉴 멜랑주 커피)."]},{"heading":"한국, 서유럽 카페 문화 비교","pages":[49,50,51],"points":["한국 카페 사진: '카공족 환영합니다 / 콘센트 이용 자유 / Wi-Fi FREE / 조용한 분위기 함께 만들어요' — 노트북·책을 펴고 혼자 공부하는 손님들.","토론 질문 ①: 한국의 카페가 '대화의 공간'이 아니라 '개인 작업 공간'으로 자리 잡은 이유는? 주거 환경·노동 문화·세대별 관계 맺기 방식 중 어떤 요인이 가장 크게 작용했을까?","토론 질문 ②: 서울에 '아연 카운터에서 낯선 사람과 대화하는' 프랑스식 카페가 생긴다면 한국 소비자에게 통할까? 통하지 않는다면 그 이유는?","강의 전체와의 연결: 서유럽 카페 = 토론·생각 교환의 장(p7), 한국 카페 = 개인 작업 공간."]}],"keywords":[{"term":"유럽 카페의 전통","def":"유럽의 카페는 단순히 커피를 마시는 곳이 아니라 토론하고 생각을 교환하는 장소로 기능했다.","detail":"17세기부터 철학자·작가·정치가가 모여 자유롭게 의견을 나누는 곳으로 정착 / 이 전통이 만들어진 도시: 파리·런던·베를린","pages":[7],"memo":false,"importance":3},{"term":"자유롭게 말하기의 전통(아고라→살롱→클럽)","def":"서유럽의 말하기 문화는 고대부터 이어진 계보를 거쳐 카페 문화로 연결된다.","detail":"고대 그리스·로마의 아고라 → 사교 문화(수사학이 인간 교양의 핵심) → 근대 살롱 문화(프랑스 교양인 '오네톰'의 탄생과 육성) → 영국 신사계급의 클럽 형성 / 오네톰(honnête homme)은 17세기 프랑스 궁정·살롱이 이상으로 삼은, 예의 바르고 교양 있는 사교인(보충)","pages":[8],"memo":false,"importance":3},{"term":"서유럽의 토론 문화(도입 영상)","def":"강의 도입에서 영국·프랑스·독일의 일상화된 토론과 의사 표현 장면을 영상으로 보여 준다.","detail":"영국 의회 토론('쇼미 디스 랩 배틀보다 살벌한 토론이 벌어지는 이곳') / 마크롱의 시민 설득('더 일하고 더 많이 벌자') / 독일 초등학생들의 시위 현장('KEIN MENSCH IST ILLEGAL') / 피켓의 뜻은 '어떤 사람도 불법이 아니다'(보충)","pages":[4,5,6],"memo":false,"importance":1},{"term":"파리에서 카페가 발전한 이유","def":"프랑스의 사교적인 문화 덕분에 카페 문화가 파리에서 가장 크게 발전했다.","detail":"개인주의적인 영국 문화, 관념적인 독일 문화와 대비 / 18세기 파리에서 시작된 카페 문화가 19세기 유럽 전역 사교 중심지의 토대","pages":[9],"memo":false,"importance":3},{"term":"도시별 카페의 역할(파리·런던·베를린)","def":"세 도시의 카페는 각 도시의 성격에 따라 서로 다른 역할을 했다.","detail":"파리=프랑스 혁명·계몽주의 시대의 중요한 역할, 정치·사회 문제에 대한 열띤 토론 / 런던=금융·상업의 중심지로서 경제·정치에 관한 중요한 논의 / 베를린=문학·철학의 중심지로서 예술가·사상가가 모인 장소","pages":[10],"memo":false,"importance":3},{"term":"커피와 차의 전래(17세기)","def":"17세기 유럽에 커피와 차가 들어오면서 카페가 중요한 사회적 공간으로 자리 잡았다.","detail":"커피=터키를 통해 유입, 차=중국에서 전래 / 17~18세기 유럽 도시=자유로운 소통이 가능한 곳, 남성들이 가정을 벗어나 자유롭게 만나는 곳","pages":[12],"memo":false,"importance":2},{"term":"키바 한(Kiva Han)","def":"1475년 오스만 제국의 수도 콘스탄티노플에 문을 연 최초의 카페.","detail":"15세기 오스만 제국=매우 번성한 문화의 중심지, 커피 인기가 매우 높은 곳 / 콘스탄티노플은 지금의 이스탄불(보충)","pages":[13],"memo":false,"importance":2},{"term":"1529년 오스만 제국의 오스트리아 침공","def":"이 침공을 계기로 유럽에 커피가 전파되었다.","detail":"유럽 최초의 카페 타임라인의 출발점(1529 커피 전파 → 1650 영국 커피하우스) / 1529년 침공은 오스만의 1차 빈 포위(보충)","pages":[14],"memo":false,"importance":2},{"term":"영국 최초의 커피하우스(1650, 옥스퍼드)","def":"1650년 옥스퍼드에서 영국 최초의 커피하우스가 문을 열었다.","detail":"17세기에 2000개 넘는 커피하우스 존재 / 커피무역을 독점한 사람들 때문에 '카페'보다 '커피하우스'라는 이름이 정착","pages":[14,22],"memo":false,"importance":3},{"term":"페니 대학(Penny University)","def":"1페니만 내면 오래 머물며 누구나 의견을 표현·교환할 수 있었던 영국 커피하우스의 별칭.","detail":"1페니를 낸 뒤 오랜 시간 머무를 수 있는 곳 / 누구나 자신의 의견을 표현하고 교환하는 곳 / 사회적 비판의 장","pages":[15],"memo":false,"importance":3},{"term":"18세기 프랑스 카페의 전성기","def":"18세기 프랑스의 카페는 가십·학문·정치가 오가는 장소로 전성기를 맞았다.","detail":"은밀한 가십이 퍼지는 장소 / 학문적인 토론의 장소 / 정치적 인사들의 모임 장소","pages":[16],"memo":false,"importance":2},{"term":"카페 첸트랄(Café Central)","def":"19세기 말 예술가들의 장소로 자리 잡은 오스트리아 빈의 대표 카페.","detail":"1867년 개점 / 프로이트·히틀러·스탈린 등 역사적 인물이 드나듦","pages":[17,18],"memo":false,"importance":2},{"term":"카페 플로리안(Florian)","def":"이탈리아 베네치아(베니스)에 있는 유럽 최초의 문학 카페.","detail":"루소·괴테·스탕달 등이 찾음 / 1720년 산마르코 광장에서 개업(보충)","pages":[17,19],"memo":false,"importance":2},{"term":"20세기 프랜차이즈 카페 유입","def":"20세기 들어 스타벅스 같은 프랜차이즈 카페가 서유럽 도시에 들어왔다.","detail":"사진: 파리의 스타벅스, 베를린의 스타벅스","pages":[20],"memo":false,"importance":1},{"term":"국민 음료와 국민성","def":"유럽 각국의 국민 음료는 각 나라의 특성을 반영한다.","detail":"프랑스 포도주=온화한 기후·풍부한 포도 재배 / 독일 맥주=역사가 긴 규제를 통한 철저함과 전통 / 영국 홍차=정통성과 차분함 / 독일 맥주 규제의 대표 예는 1516년 맥주순수령(보충)","pages":[21],"memo":false,"importance":2},{"term":"영국 커피하우스의 흐름","def":"펍 문화에서 출발한 영국 커피하우스가 지식인의 공간을 거쳐 클럽으로 발전한 과정.","detail":"펍의 성행(맛없는 음식→술로 배 채움, 맥주를 많이 마심) → 자본주의 선도(시민사회 실현, 차 문화 발달) → 1650 최초의 커피하우스 → 홍차의 보급(펍을 능가하는 커피하우스 증가, 지식인·전문직 모임) → 문학 커피하우스(문인·배우 출입) = 영국 클럽의 기원","pages":[22],"memo":false,"importance":2},{"term":"카페 로열과 팁(TIP)","def":"19세기 보헤미안 시대 런던의 대표 문예 커피하우스와 그 무렵 생긴 팁 풍습.","detail":"화가·시인들이 커피하우스를 단골로 드나들던 시기 / 대표 인물: 상징파 화가 제임스 휘슬러 / 팁 = to insure promptness(신속함을 보장하기 위해)의 머리글자","pages":[23],"memo":false,"importance":2},{"term":"애프터눈 티(Afternoon Tea)","def":"영국 커피하우스 문화에서 생겨난, 오후에 손님을 초대해 차를 마시는 사교 문화.","detail":"집에 손님을 초대해 정원에서 차를 마시는 것이 예의 / 여주인 중심의 사교 문화 / 오후 4~6시 / 영상: 애프터눈 티 문화의 유래(MBC every1 \u003c위대한 가이드>), 런던 리치몬드의 애프터눈 티 카페","pages":[24,25],"memo":false,"importance":2},{"term":"스펙테이터(The Spectator)","def":"영국 커피하우스에서 발족한 유럽 최초의 일간지(슬라이드 기준)로, 커피하우스가 '근대 저널리즘의 요람'이었음을 보여 준다.","detail":"슬라이드 이미지 속 발행일 1711년 / 신문·잡지 편집자가 정보를 얻고 기사를 쓰는 곳, 작가·독자가 문학적 사고와 문서작성법을 배우는 곳 → 근대적 의회정치·저널리즘·근대적 소설 발생 / 조지프 애디슨과 리처드 스틸이 창간(보충)","pages":[24],"memo":false,"importance":3},{"term":"카페 프로코프(Café Procope)","def":"1686년 파리에 문을 연 프랑스 최초의 카페로, 문학 담론·계몽사상·혁명의 무대.","detail":"검은 옷·흰 헝겊·은쟁반 종업원 복장의 시작 / 맞은편 코미디 프랑세즈 극장의 배우·관객 → 부르주아 지식인 손님 / 초기 단골: 시인 라퐁텐, 극작가 보마르셰 / 볼테르·디드로·콩도르세의 토론 / 혁명 후 문학 카페(스탕달·뮈세·발자크·위고·조르주 상드) → 오늘날 레스토랑","pages":[26,27,28,31,32],"memo":false,"importance":3},{"term":"프랑스 혁명의 기폭제, 프로코프","def":"18세기 프로코프는 정치적 담론의 장소로서 계몽주의 정신을 이어받아 프랑스 혁명의 기폭제가 되었다.","detail":"17세기 살롱(우아한 취미) → 18세기 자유로운 정치 담론 / 시민이 카페를 통해 신분·종파를 초월한 철학자가 됨 / 에베르·당통·마라·로베스피에르가 혁명 작전 모의 / 혁명의 상징 '붉은 모자'가 선보인 곳 → 2024 파리 올림픽 마스코트도 '자유의 모자' / 붉은 모자는 프리기아 모자이고 마스코트 이름은 '프리주(Phryges)'(보충)","pages":[29,30],"memo":false,"importance":3},{"term":"오스만의 개혁과 벨에포크","def":"19세기 오스만의 개혁으로 오늘날 파리의 모습이 형성되었고, 외면받던 예술가들이 몽마르트르·몽파르나스로 모였다.","detail":"과학과 기술 때문에 예술가들이 외면당함 → 벨에포크 시기 예술가들이 몽파르나스·몽마르트르에 모임 → 파리 문화예술을 꽃피운 상징적 장소 / 여기서 오스만은 오스만 제국이 아니라 1853~1870년 파리를 대개조한 센 도지사 오스만 남작(보충) / 벨에포크는 19세기 말~1차 세계대전 전의 '아름다운 시절'(보충)","pages":[33],"memo":false,"importance":2},{"term":"몽마르트르와 몽파르나스","def":"19세기 이후 파리 예술가들이 모인 카페 성지.","detail":"몽마르트르=화가들의 예술적 교류(브라크·들로네·뒤샹·칸딘스키·피카소) / 몽파르나스=20세기 초 전 세계 예술가의 국제적 예술 공동체, 라 로통드(La Rotonde)·르 돔(Le Dôme)·라 쿠폴(La Coupole), 피카소·모딜리아니·샤갈","pages":[33,34],"memo":false,"importance":2},{"term":"생제르맹데프레","def":"2차 세계대전 이후 파리 지성의 중심이 옮겨 간 곳.","detail":"카페 드 플로르(Café de Flore)·레 되마고(Les Deux Magots) / 사르트르·보부아르의 실존주의 사상 / 알베르 카뮈, 초현실주의자 앙드레 브르통 / p35 오늘날의 카페 되마고","pages":[34,35],"memo":false,"importance":2},{"term":"카페 드 플로르(Café de Flore)","def":"1885년 개점한 되마고의 라이벌로, 되마고와 함께 파리 카페 문화를 상징하는 문예 살롱.","detail":"아폴리네르·피카소의 문예지 '파리의 저녁' 창간 / 앙드레 지드가 주도한 '신프랑스 평론'(1908년) 시작 / 반예술적·허무적 예술운동인 다다이즘 작가들 / 생텍쥐페리·피카소·헤밍웨이·카뮈, 기호학자 롤랑 바르트가 단골 / 사진: 1900년대와 오늘날의 플로르","pages":[36,37,38,39],"memo":false,"importance":3},{"term":"사르트르와 보부아르","def":"생제르맹데프레 카페에서 만나던 '계약부부'로, 실존주의 사상의 상징.","detail":"카페 드 플로르에서 자주 만남 / 생제르맹데프레의 실존주의 / p40 사진 / p37의 '보루아르'는 보부아르의 오기","pages":[34,37,40],"memo":false,"importance":2},{"term":"베를린 카페의 시작","def":"베를린은 파리·런던보다 늦게, 1920년대 들어서야 카페가 유행했다.","detail":"독일 최초의 카페=북해 항구 / 베를린 1721년 대중적인 커피하우스(망명한 프랑스 위그노가 개점) / 19세기까지 시민에게 낯선 존재, 손님 대부분 근위장교, 작가는 구석에서 담론(프로이센의 전형) / 1898년 베스텐스(Westens) 카페 개점 이후 카페 문화 정착 / 정식 이름은 카페 데스 베스텐스(Café des Westens)(보충)","pages":[43],"memo":false,"importance":2},{"term":"로마니셰스 카페와 바이마르 공화국","def":"1920년대 베스텐스를 대신해 베를린의 중심 카페가 된 곳으로, 바이마르 시기 '창조의 실험장' 베를린을 상징한다.","detail":"1차대전 패전·바이마르 공화국 → 전통 청산 의지인 신즉물주의·표현주의 부상 / 칸딘스키(상징적 인물)·클레, 브레히트·추크마이어, 신즉물주의 작가 케스텐·시인 케스트너(『에밀과 탐정들』 탄생) / 독일·소련·미국 작가·예술가 집결 / 1920년대 후반 히틀러 제3제국 군인들의 탄압으로 파괴","pages":[44,45,46],"memo":false,"importance":3},{"term":"카페 아인슈타인(Einstein)","def":"1970년대 말 베를린 카페 문화의 부활을 보여 주는 카페.","detail":"대표 메뉴 멜랑주 커피 / 멜랑주는 빈식 우유 거품 커피(보충)","pages":[47,48],"memo":false,"importance":1},{"term":"한국 카페 vs 서유럽 카페","def":"서유럽 카페가 '대화의 공간'이라면 한국 카페는 '개인 작업 공간'으로 자리 잡았다.","detail":"한국 카페 사진: '카공족 환영합니다 / 콘센트 이용 자유 / Wi-Fi FREE / 조용한 분위기' / 요인 후보: 주거 환경·노동 문화·세대별 관계 맺기 방식 / 질문: '아연 카운터에서 낯선 사람과 대화하는' 프랑스식 카페가 서울에서 통할까? / 아연 카운터(le zinc)는 프랑스 카페의 금속 상판 바로, 서서 마시며 주인·손님과 대화하는 자리(보충)","pages":[49,50],"memo":false,"importance":3}],"memos":[],"questions":[{"q":"런던·파리·베를린의 카페가 각각 어떤 사회적·문화적 역할을 했는지 비교하고, 그 차이가 생긴 배경을 서술하시오.","likelihood":3,"why":"학습 내용 04 '런던, 파리, 베를린의 카페와 문화적 의의'가 강의의 절반 이상(p22~48)을 차지하고, p7·p10에서 세 도시를 반복해 정리함.","outline":["서론: 유럽 카페는 커피가 아니라 토론·생각 교환의 장이며, 이 전통은 파리·런던·베를린에서 만들어짐(p7).","본론 ① 런던(금융·상업 → 경제·정치 논의): 1650 옥스퍼드 첫 커피하우스, '페니 대학', 스펙테이터 등 근대 저널리즘·의회정치·근대 소설, 영국 클럽의 기원과 애프터눈 티.","본론 ② 파리(혁명·계몽 → 정치·사회 토론): 1686 프로코프 → 18세기 정치 담론과 혁명 모의(당통·마라·로베스피에르, 붉은 모자) → 몽마르트르·몽파르나스 예술가 → 2차대전 후 생제르맹데프레의 플로르·되마고(실존주의).","본론 ③ 베를린(문학·철학 → 예술가·사상가): 늦은 정착(1721 위그노, 1898 베스텐스) → 1920년대 로마니셰스 카페, 바이마르의 신즉물주의·표현주의 '창조의 실험장' → 나치 탄압과 파괴 → 1970년대 말 아인슈타인으로 부활.","결론: 차이는 국민성(사교적 프랑스 ↔ 개인주의 영국·관념적 독일, p9)과 정치사에서 비롯되지만, 세 도시 모두 카페는 시민이 자유롭게 말하는 사회적 공간이었음."],"mustKeywords":["토론과 생각 교환","페니 대학","스펙테이터","프로코프","프랑스 혁명","카페 드 플로르","로마니셰스 카페","바이마르 공화국"],"pages":[7,9,10,15,22,24,26,29,34,36,43,44,45,46]},{"q":"유럽의 카페가 단순히 커피를 마시는 곳이 아니라 '토론하고 생각을 교환하는 장소'가 된 배경을 서유럽의 말하기(이야기) 문화 전통과 연결하여 서술하시오.","likelihood":3,"why":"학습 내용 01·02(유럽의 카페란/이야기 문화의 유럽)와 바로 이어짐. p7 정리 슬라이드, p8 흐름 도식, p12 3단계 도식, 도입 영상 3개(p4~6)가 모두 같은 메시지를 반복함.","outline":["서론: 카페는 17세기부터 철학자·작가·정치가가 모여 자유롭게 의견을 나누는 토론·생각 교환의 장으로 정착(p7).","본론 ① 말하기 전통의 계보: 고대 그리스·로마의 아고라 → 수사학이 교양의 핵심인 사교 문화 → 근대 프랑스 살롱(교양인 오네톰) → 영국 신사계급의 클럽(p8).","본론 ② 카페의 형성: 17세기 커피(터키 경유)·차(중국) 전래 → 17~18세기 도시는 자유로운 소통의 공간, 남성들이 가정을 벗어나 만나는 곳 → 사회적 공간으로 정착(p12). 예: 영국 '페니 대학', 파리 프로코프.","본론 ③ 오늘까지 이어지는 토론 문화: 영국 의회의 격렬한 토론, 시민을 설득하는 마크롱, 시위하는 독일 초등학생(p4~6).","결론: 카페는 시민이 신분·종파를 초월한 철학자가 되는 공간(p29)으로서 계몽·혁명·저널리즘·예술을 낳음. 하버마스의 '공론장' 개념으로 정리할 수 있음(보충)."],"mustKeywords":["아고라","수사학","살롱","오네톰","클럽","17세기 커피 전래","자유로운 소통","사회적 공간"],"pages":[4,5,6,7,8,12,15,29]},{"q":"한국의 카페가 '대화의 공간'이 아니라 '개인 작업 공간'으로 자리 잡은 이유를 서유럽 카페 문화와 비교하여 논하시오. (주거 환경·노동 문화·세대별 관계 맺기 방식 중 가장 큰 요인을 제시할 것)","likelihood":3,"why":"마지막 슬라이드(p50)에 교수가 직접 던진 토론 질문 2개가 있어 서술형으로 그대로 나올 가능성이 큼. p49 한국 카페 사진과 짝을 이룸.","outline":["서론: 서유럽 카페 = 토론·생각 교환의 장(p7), 한국 카페 = '카공족 환영·콘센트 이용 자유·Wi-Fi FREE·조용한 분위기'의 개인 작업 공간(p49).","본론 ① 서유럽 사례: 페니 대학(누구나 의견 교환), 프로코프(혁명 모의), 카페 드 플로르(문예 살롱) — 낯선 사람과도 말을 섞는 공간.","본론 ② 한국의 요인: 주거 환경 — 좁은 집과 1인 가구 때문에 공부·작업할 제3의 공간이 필요함(보충). 노동 문화 — 장시간 노동·자기계발·시험 준비가 카공으로 이어짐(보충). 세대별 관계 맺기 — 아는 사람끼리만 대화하고 관계가 온라인 중심임(보충).","본론 ③ '아연 카운터에서 낯선 사람과 대화하는' 프랑스식 카페가 서울에서 통할까: 낯선 이와의 대화를 꺼리는 문화라 어렵다는 입장과, 커뮤니티·취향 모임형으로 바꾸면 가능하다는 입장(보충).","결론: 카페의 기능은 그 사회의 말하기 문화와 생활 구조를 비춤. 가장 큰 요인 하나를 골라 자기 입장으로 마무리."],"mustKeywords":["대화의 공간","개인 작업 공간","카공족","주거 환경","노동 문화","세대별 관계 맺기","아연 카운터","토론 문화"],"pages":[7,15,26,29,36,49,50]},{"q":"파리의 카페 프로코프(Café Procope)가 프랑스 혁명과 프랑스 문학·사상사에서 가진 의의를 시기별로 서술하시오.","likelihood":3,"why":"카페 하나에 가장 많은 슬라이드(p26~32, 7쪽)를 씀. '프로코프의 의의', '프랑스 혁명의 기폭제 역할을 한 프로코프'처럼 의의를 묻는 소제목이 그대로 문제가 되기 쉬움.","outline":["서론: 1686년 파리에 문을 연 프랑스 최초의 카페 프로코프 — 오늘날 카페 종업원 복장(검은 옷·흰 헝겊·은쟁반)의 시작.","본론 ① 개점기: 맞은편 코미디 프랑세즈의 배우·관객 → 부르주아 지식인 손님. 라퐁텐·보마르셰 등 문인·철학자가 문학을 토론 → 문학 담론의 중심, 파리 전역에 카페 확산.","본론 ② 18세기: 17세기 살롱의 우아한 취미에서 자유로운 정치 담론으로 변화. 볼테르·디드로·콩도르세가 토론했고, 시민이 신분·종파를 초월한 철학자가 됨.","본론 ③ 혁명의 기폭제: 계몽주의 정신 계승, 에베르·당통·마라·로베스피에르의 혁명 작전 모의, 혁명의 상징 붉은 모자가 처음 등장(2024 파리 올림픽 마스코트로 이어짐).","본론 ④ 혁명 이후~오늘: 문학 카페로 회귀(스탕달·뮈세·발자크·위고·조르주 상드, 소르본 학생) → 현재는 레스토랑.","결론: 프로코프는 카페에서 나눈 말(계몽사상)이 행동(혁명)으로 이어진 대표 사례이자 프랑스 문학의 무대."],"mustKeywords":["1686년","코미디 프랑세즈","볼테르·디드로","계몽주의","프랑스 혁명의 기폭제","당통·마라·로베스피에르","붉은 모자","문학 카페"],"pages":[26,27,28,29,30,31,32]},{"q":"영국의 커피하우스가 '페니 대학(Penny University)'이라 불린 이유를 설명하고, 커피하우스가 영국 사회에 남긴 문화를 서술하시오.","likelihood":2,"why":"런던 파트(p22~25)의 핵심이며, p15 '페니 대학'과 p24 '근대 저널리즘의 요람'이 박스 제목으로 강조됨.","outline":["서론: 1650년 옥스퍼드 최초의 커피하우스 → 17세기 2000개 이상(p14). 펍이 성행하던 영국에서 지식인·전문직의 모임 장소로 성장(p22).","본론 ① 페니 대학: 1페니만 내면 오래 머물며 누구나 의견을 표현·교환하는 곳, 사회적 비판의 장 → 대학처럼 배우는 공간(p15).","본론 ② 근대 저널리즘의 요람: 유럽 최초의 일간지 '스펙테이터' 발족. 편집자가 정보를 얻고 기사를 쓰며 작가·독자가 문서작성법을 배움 → 근대 의회정치·저널리즘·근대 소설 발생(p24).","본론 ③ 생활·사교 문화: 애프터눈 티(정원 초대, 여주인 중심, 오후 4~6시), 문학 커피하우스 → 영국 클럽의 기원, 19세기 카페 로열·휘슬러, 팁(to insure promptness)(p22~24).","결론: 영국 커피하우스는 자본주의·시민사회와 함께 성장한 정보와 여론의 공간이었음."],"mustKeywords":["1650년 옥스퍼드","페니 대학","사회적 비판의 장","스펙테이터","근대 저널리즘","애프터눈 티","영국 클럽의 기원","팁"],"pages":[14,15,22,23,24,25]},{"q":"최초의 카페에서 20세기 프랜차이즈 카페까지, 유럽 카페의 탄생과 변천 과정을 시대순으로 서술하시오.","likelihood":2,"why":"학습 내용 03 '카페의 탄생과 변천'에 해당하며, p13~20이 같은 제목 아래 연도 중심으로 서술됨.","outline":["서론: 카페는 커피 전래와 함께 시작해 시대마다 성격이 바뀌었음.","본론 ① 기원: 1475년 오스만 제국 수도 콘스탄티노플의 키바 한(최초의 카페) → 1529년 오스만의 오스트리아 침공으로 유럽에 커피 전파.","본론 ② 17~18세기: 1650년 옥스퍼드 첫 커피하우스, 17세기 2000개 이상, 페니 대학. 18세기 프랑스 전성기에는 가십·학문 토론·정치 인사 모임의 장소.","본론 ③ 19세기: 유럽 전역의 사교 중심지이자 예술가·문학가의 장소 — 빈 카페 첸트랄(1867, 프로이트·히틀러·스탈린), 베네치아 플로리안(유럽 최초 문학 카페, 루소·괴테·스탕달), 파리의 카페.","본론 ④ 20세기: 파리·베를린에 스타벅스 등 프랜차이즈 카페 유입.","결론: 정보·정치 토론 공간 → 예술·문학 공간 → 대중 소비 공간으로 바뀌었지만 '말하는 공간'이라는 전통은 이어짐."],"mustKeywords":["키바 한","1475년","1529년","1650년 옥스퍼드","18세기 프랑스 전성기","카페 첸트랄","카페 플로리안","프랜차이즈"],"pages":[9,12,13,14,15,16,17,18,19,20]}],"a4":["카페 = 커피 X, 토론·생각 교환의 장 / 17C~ 철학자·작가·정치가 / 무대: 파리·런던·베를린 (p7)","말하기 계보: 아고라(그리스·로마) → 사교 문화(수사학=교양 핵심) → 근대 살롱(佛 오네톰) → 英 신사 클럽 → 카페 (p8)","도시 역할: 파리=혁명·계몽, 정치·사회 토론 / 런던=금융·상업, 경제·정치 논의 / 베를린=문학·철학, 예술가·사상가 ※ 파리 발달 이유: 佛 사교적 ↔ 英 개인주의·獨 관념적 (p9~10)","17C 커피(터키 경유)·차(중국) 전래 → 17~18C 도시=자유로운 소통, 남성들이 가정 벗어나 만남 → 사회적 공간 (p12)","1475 키바 한(콘스탄티노플, 오스만) 최초 카페 → 1529 오스만의 오스트리아 침공 → 유럽에 커피 전파 (p13~14)","英 1650 옥스퍼드 첫 커피하우스, 17C 2000개↑ / 1페니 '페니 대학' = 누구나 의견 교환, 사회적 비판의 장 (p14~15)","런던: 펍 성행 → 자본주의(시민사회, 차 문화) → 1650 커피하우스(무역 독점자→명칭) → 홍차 보급(지식인·전문직) → 문학 커피하우스 = 英 클럽의 기원 (p22)","런던 유산: 애프터눈 티(정원 초대·여주인 중심·오후 4~6시) / 근대 저널리즘 요람 '스펙테이터'(유럽 최초 일간지, 1711) → 의회정치·저널리즘·근대소설 (p24)","19C 런던 보헤미안: 상징파 화가 휘슬러, 문예 커피하우스 '카페 로열', TIP = to insure promptness (p23)","프로코프 1686(佛 최초): 검은 옷·흰 헝겊·은쟁반 종업원 / 맞은편 코미디 프랑세즈 → 부르주아 지식인 / 라퐁텐·보마르셰, 볼테르·디드로·콩도르세 (p26~28)","18C 佛 전성기(가십·학문 토론·정치 인사 모임) / 프로코프: 17C 살롱 → 자유로운 정치 담론, 신분·종파 초월 / 혁명 기폭제: 에베르·당통·마라·로베스피에르 모의, 붉은 모자(→2024 파리올림픽 마스코트) (p16, p29~30)","혁명 후 프로코프: 문학 카페 회귀(스탕달·뮈세·발자크·위고·조르주 상드, 소르본 학생) → 오늘날 레스토랑 (p31~32)","19C 예술가 카페: 빈 카페 첸트랄(1867, 프로이트·히틀러·스탈린) / 베네치아 플로리안(유럽 최초 문학 카페, 루소·괴테·스탕달) / 20C 스타벅스 유입 (p17~20)","오스만 개혁 후 벨에포크 예술가: 몽마르트르(브라크·들로네·뒤샹·칸딘스키·피카소) / 몽파르나스(라 로통드·르 돔·라 쿠폴, 피카소·모딜리아니·샤갈) (p33~34)","2차대전 후 생제르맹데프레: 카페 드 플로르·레 되마고 — 사르트르·보부아르(실존주의, 계약부부), 카뮈, 브르통 (p34~37)","카페 드 플로르 1885: 아폴리네르·피카소 '파리의 저녁', 지드 '신프랑스 평론'(1908), 다다이즘, 생텍쥐페리·헤밍웨이·롤랑 바르트 (p36~37)","베를린: 북해 항구(독일 첫 카페) → 1721 위그노 커피하우스 → 19C 근위장교·구석 담론(프로이센) → 1898 베스텐스 → 1920s 로마니셰스(칸딘스키, 케스트너 『에밀과 탐정들』) (p43~44)","바이마르: 신즉물주의·표현주의, 브레히트·추크마이어, 칸딘스키·클레 = 창조의 실험장 → 1920s 후반 제3제국 탄압·로마니셰스 파괴 → 1970s 말 카페 아인슈타인(멜랑주) (p45~48)","국민 음료: 佛 포도주(온화한 기후·포도) / 獨 맥주(긴 규제→철저함·전통) / 英 홍차(정통성·차분함) (p21)","한국 카페 = 개인 작업 공간(카공족·콘센트·Wi-Fi·조용) ↔ 서유럽 = 대화의 공간 / 요인: 주거 환경·노동 문화·세대별 관계 맺기 / 佛 '아연 카운터' 카페가 서울에서 통할까? (p49~50)"],"links":["2주차 예술사조의 변화 ↔ 카페는 예술사조의 산실: 몽마르트르·몽파르나스의 피카소·브라크·뒤샹·칸딘스키·샤갈, 플로르의 다다이즘·초현실주의(브르통), 베를린의 표현주의·신즉물주의(칸딘스키·클레).","3주차 대학 ↔ 영국 커피하우스 '페니 대학'(1페니로 누구나 배우고 토론), 혁명 후 프로코프에 드나든 소르본 학생들 — 대학 밖의 지식 교류 공간.","5주차 유럽의 종교 ↔ 베를린 첫 대중 커피하우스(1721)를 연 망명 프랑스 위그노, 카페에서 '신분과 종파를 초월한' 철학자가 된 파리 시민. 위그노는 종교 박해를 피해 망명한 프랑스 칼뱅파 신교도(보충).","7주차 영화 ↔ 이번 주 참고문헌에 이나라 『유럽 영화 운동』(한길사, 2015)이 들어 있음. 카페가 문학·미술 운동의 거점이었듯 '도시의 만남 문화가 예술 운동을 낳는다'는 관점으로 연결 가능."],"memoTitle":"내 메모","memoHint":"PDF에 직접 적은 것","memoTag":"내 메모","short":"카페","pageCount":51},{"week":7,"title":"영화","oneLiner":"영화는 프랑스에서 태어나 미국에 밀렸지만, 유럽은 '문화적 예외'로 지켜냈다","bigQuestion":"영화를 처음 만든 유럽은 미국 영화의 공세 속에서 왜, 그리고 어떻게 영화를 '산업'이 아닌 '문화'로 지켜 왔는가?","flow":["1895년 파리 그랑 카페에서 뤼미에르 형제의 시네마토그라프 상영으로 영화가 탄생했다. 사진술·만국박람회·대중오락 전통이 있던 프랑스가 탄생지다.","출발부터 두 뿌리가 있었다. 뤼미에르의 리얼리즘(현실 기록)과 멜리에스의 스펙타클(허구·특수효과) 사이를 영화사는 진자처럼 오간다.","1분짜리 희극으로 카페·시장에서 상영되던 노동자 오락이 1908년 장편화와 문학 각색으로 내러티브를 얻어 '예술'로 승화했다. 이 시기 파테·고몽이 세계 시장을 장악했다.","1차대전으로 유럽 영화가 무너지자 미국이 스타시스템·동시대 소재로 시장을 장악했다(아메리카니즘 승리). 유럽은 '영화 유럽'으로 맞섰지만 2차대전기 나치 선전으로 정체성이 왜곡됐다.","전후 가치관 차이가 뚜렷해졌다. 유럽은 영화를 예술·위대한 감독의 역사로, 미국은 산업·헐리우드와 스타의 역사로 본다.","고예산 미국 영화에 맞서 네오리얼리즘을 바탕으로 프랑스 누벨바그(작가주의·저예산·거리 촬영)와 독일 뉴저먼 시네마(오버하우젠 선언, ★향토영화·할리우드 오락영화에 반발)가 등장했다.","60년대 이후 TV 보급과 블록버스터로 미국 지배가 굳어지고, 2000년대 유럽 영화도 미국화됐다.","1993년 GATT에서 프랑스는 영상물을 '정신과 영혼의 산물'로 보고 '문화적 예외'를 주장했고, 이는 '문화적 다양성'으로 확대됐다. ★결론: 미국 vs 유럽 구도에서 영화는 문화적 예외다(학생 메모).","오늘날 국가별 영화 정체성: 영국은 절제된 왕실 역사극, 프랑스는 혁명·저항과 민중의 시선, 독일은 역사 반성과 기억."],"sections":[{"heading":"Intro · 학습 내용","pages":[1,2,3],"points":["Intro 질문 '유럽 영화, 정말 지루할까?'에서 출발해 유럽 영화를 미국 영화와 비교하며 다시 보는 주차.","학습 내용 4개: ①영화의 탄생지, 서유럽 ②미국영화와 유럽영화의 경쟁 ③미국의 고예산 영화에 맞선 유럽의 영화 운동 ④유럽영화의 방어자, 문화적 예외.","★학생 메모(p1): 미국 vs 유럽 → 영화는 '문화적 예외'이다. 주차 전체의 결론을 표지에 적어 둠."]},{"heading":"'영화'라는 말 자체가 프랑스에서 시작됐다 · 영화의 탄생지 유럽","pages":[4,6,7,8,9,10,11,13,15,16],"points":["1895년 12월 28일 파리 그랑 카페에서 뤼미에르 형제가 세계 최초 유료 상영 → '영화'라는 말 자체가 프랑스에서 시작.","시네마토그라프(Cinématographe): 뤼미에르 형제의 발명. 기술이자 여러 사람이 함께 보는 '동시 관람 경험'의 발명.","영화의 탄생은 시대의 관심사가 만든 발명: 키네토스코프(에디슨), 비타스코프(토마스 아맷), 프락시노스코프(조에트로프와 에밀 레이노), 파나키스토스코프(조셉 플라토).","왜 하필 프랑스? ①사진술(다게레오타입) 발상지라는 기술적 토양 ②파리 만국박람회로 상징되는 스펙터클 전시 문화 ③판토마임·마술쇼가 성행한 대중오락 전통.","상영작 예: '열차의 도착'(시오타 역에 도착하는 기차), '물 뿌리는 정원사'(포스터·영상)."]},{"heading":"리얼리즘 vs 스펙타클 — 영화의 두 뿌리","pages":[5,12],"points":["영화는 리얼리즘(뤼미에르)과 스펙타클(멜리에스) 사이를 오가는 진자운동이다.","뤼미에르: 「열차의 도착」「공장을 나서는 노동자들」. 고정 카메라로 일상을 실사 기록한 다큐멘터리적 리얼리즘의 원형 → 시적 리얼리즘·누벨바그로 계승.","멜리에스: 「달세계 여행」(1902). 마술사 출신, 이중노출·스톱모션 등 특수효과를 발명한 '환상의 스펙타클' → 블록버스터·오늘날 CGI로 계승."]},{"heading":"영화의 형성, 멜리에스","pages":[18,19],"points":["예술 영화의 선구자 조르주 멜리에스 = 영화 역사상 최초의 거장, 영화 언어의 구축자, 진정한 영화 탄생의 개척자.","\u003c달세계 여행>(Le voyage dans la lune, 1902)을 기점으로 영화가 허구의 세계를 만드는 예술 장르로 탄생.","다양한 장치와 기술 효과로 현실보다 재미있는 허구세계를 만들어 '영화산업의 시대'를 연 장본인.","영화 산업과의 경쟁에서는 밀렸지만 진정한 영화 이야기를 만든 거장으로 인정받음."]},{"heading":"초기 영화 · 초기 영화 산업을 지배한 프랑스","pages":[14,17,20,21,22,23],"points":["초기 필름: 기술적 한계로 1분 정도, 희극 형태. 길이가 늘며 플롯이 필요해지자 창작 대신 검증된 이야기를 활용(연극·오페라에서도 일반적).","초기 영화는 예술적 지위를 얻지 못함: 예술 행사의 여러 공연 중 하나, 1905년까지 전용 영화관 없음, 시장·카페에서 상영, 노동자 계급 관객(오페라와 대조).","1911년 파리에 3400석 규모의 고몽 팔라스 영화관 건설 → 1차대전 후 각국이 프랑스식 화려한 영화관을 모방(런던 팰리스 극장 사진).","세계 각국 수입 영화의 60~70%가 프랑스 영화. 세계 최대 영화사 파테 프레르가 식민 시장을 활용해 확장했고, 경쟁사도 프랑스의 고몽."]},{"heading":"예술로 승화된 영화(네러티브와 문학)","pages":[24,25,26,27,28,29,30,31],"points":["1908년부터 긴 영화 촬영 가능: 15분짜리 릴을 바꿔 끼우며 1시간 동안 상영.","초기 영화는 대부분 문학 작품 각색. 감독 다수가 극단 출신이고 관객이 중산층인 현실이 반영됨.","각색 사례: 코르시카 형제들(1898 조지 앨버트 스미스), 삼총사(1903 멜리에스), 여왕의 목걸이(1909 루이 푀이야드) 등 뒤마 원작. 쥘 베른 '80일간의 세계일주'·'해저 2만리'는 여러 번 영화화.","푀이야드는 인기 캐릭터 '팡토마'를 영화화해 고몽을 제1의 영화사로 만들었고, 고딕 장르 '뱀파이어'도 제작.","범죄 영화: 영국 '과감한 대낮의 강도질'(1903), 미국 소설 '탐정의 왕, 닉 카터'(1908)를 프랑스가 원작보다 사색적·프랑스적으로 영화화. 독일은 전쟁 중 탐정영화 외 많은 영화 금지(스튜어트 웹스, 미스 노바디).","결과: 모든 문학을 각색하며 영화가 소설을 알리는 기능 → 프랑스에서 영화를 예술적 창작물로 보는 견해에 합의, 지적재산권 등 법규 적용."]},{"heading":"미국 영화의 등장과 유럽 영화","pages":[32,33,34,35],"points":["1차대전 이후 미국은 경제력을 바탕으로 세계 최대 영화 수출국. 유럽은 총동원령으로 스튜디오·영화관이 폐쇄되고 프랑스 생산이 급감.","1910년대 미국 영화의 유럽 시장 침공: 독점금지법 시행·카르텔 해체, 키스톤 영화사와 찰리 채플린 영화 진출 → 프·영·독에서 미국 영화가 더 많이 상영.","새 스타일의 미국 영화: 스타시스템(배우-캐릭터 동화, 사생활·가십 확장), 대규모 이민으로 형성된 유럽인 시장, 무거운 유럽 영화와 달리 동시대적 소재.","결과: 미국이 유럽을 양적·질적으로 능가. '유럽의 주요 문화산업으로 출발했지만 아메리카니즘이 승리'.","대응: '영화 유럽(Film Europe)' 결성. 넓은 유럽 시장을 연결하고 유럽 연대감이 담긴 문화정체성 추구 → 자국 영화 증가, 미국 영화 진입 감소.","2차대전과 파시즘: 영화를 정치 선전에 활용, 독일이 미국에 대항하는 구조, 친독 프랑스의 미국 영화 배제·동유럽 민족영화 등장 → 왜곡된 문화정체성, 장기간 정체성 논의 중단."]},{"heading":"양차 대전 이후의 영화들","pages":[36,51,52],"points":["유럽: 영화를 단순한 산업으로 보지 않음. 유럽 영화의 역사는 위대한 감독들의 이야기이며, 미국 대중문화를 비판하면서도 동경.","미국: 영화를 항상 산업으로 생각. 미국 영화의 역사는 헐리우드와 스타의 역사이며, 유럽 문화를 현대 대중사회에 맞게 재구성해 유럽과 세계로 수출.","2차대전 후 프랑스: 정치적 내용에서 멀어진 영화들이 성공. 마르셀 카르네 '천국의 아이들'이 헐리우드를 대체할 대안으로 받아들여짐.","2차대전 후 영국: 전쟁이 기회. 18세기 오페라 관객처럼 정기적으로 영화관을 찾았고 양·질 모두 성공(데이비드 린 '밀회')."]},{"heading":"고예산 미국 영화에 맞선 서유럽의 영화운동 ① 프랑스 누벨바그","pages":[37,38,39,40,41,42,43,44,45],"points":["2차대전 후 미국만 고예산 영화 제작 가능(성공작 시리즈화, 미국인 슈퍼스타) ↔ 유럽은 주류 영화에 문제를 제기하는 영화운동으로 예술적 표현을 모색. 이탈리아 네오리얼리즘을 바탕으로 누벨바그·뉴저먼 시네마가 태동.","누벨바그(Nouvelle Vague = 새로운 물결): 1950년대 말 보수적인 프랑스 사회의 권위에 도전한 젊은이들의 운동. 트뤼포·고다르 등 젊은 평론가들이 기성세대의 관습적 영화를 비판.","바탕은 카이에 뒤 시네마와 작가주의: 감독을 문인·화가처럼 작품 전체를 책임지는 주체로 봄. 1954년 트뤼포 '프랑스 영화의 어떤 경향'이 기존 영화를 인위적·상투적이라 비판.","제작 방식: 카메라를 들고 거리에서, 소규모 팀·무명 젊은 배우·적은 예산. 스튜디오 밖 촬영으로 새 촬영 스타일, 강요된 도덕관념 거부와 형식의 자유분방함.","1959년 트뤼포 '400번의 구타'와 클로드 샤브롤 '사촌들' 개봉 후 누벨바그로 지칭. 1958년 헌법 개정·검열 통제 약화·정부의 사전 제작비 지원으로 촉진.","대표작: 고다르 '네 멋대로 해라'(1960, 브레히트 이론·소격효과·헐리우드 연속편집 무시), 트뤼포 '400번의 구타'(세계적 주목), 루이 말 '연인들'(1958), 알랭 레네 '히로시마 내 사랑'(1959)·'뮈리엘'(1963).","정통 연극에서 벗어난 가벼운 스타일의 배우(장 폴 벨몽도, 브리지트 바르도)가 등장. 프랑스 영화계에 혁명을 일으키며 세계적으로 큰 영향."]},{"heading":"고예산 미국 영화에 맞선 서유럽의 영화운동 ② 독일 뉴 저먼 시네마","pages":[46,47,48,49,50],"points":["누벨바그의 자유로움·혁신성에서 영향: 젊은 프랑스 영화인의 영화문법 혁신, 프랑스의 정치·사회운동, 자유주의·탈권위주의 정신 공유.","60년대 말~70년대 프랑스 중심의 반전운동·자본주의 비판에 호응한 영화운동: 프랑스 68혁명의 영향, 1962년 오버하우젠 선언, 1960년대 후반 젊은 작가 등장.","★학생 메모: 독일에서의 특징 = 감성적인 방식의 '향토영화'와 할리우드 오락영화에 대한 반발.","작가: 라이너 W. 파스빈더, 빔 벤더스, 폴커 슐뢴도르프, 베르너 헤어조크. 급진적인 정치적 구호와 도덕적 해방 요구, 다양한 주제의식과 스타일.","클루게: 오버하우젠 선언의 정신을 구현, 브레히트적 소격효과 강조. 헤어조크: 영화 형식에 대한 끊임없는 질문과 저항, 멜로드라마를 기반으로 한 감성적이면서 사회비판적인 영화.","가장 강력한 시기는 1970년대(독일의 정치적 격변기). 1967년 프랑스 감독들의 반전영화 '베트남 멀리서'에 영향받아 1978년 클루게 제안으로 '독일의 가을' 제작. 영상 자료: '마리아 브라운의 결혼'."]},{"heading":"60년대 이후의 영화","pages":[53,54,55,56],"points":["텔레비전 시대: 유럽 여러 나라가 TV를 통해 영화산업 지원. 영국 BBC·채널4, 프랑스 카날 플뤼스, 독일 ARD·ZDF.","TV 보급으로 영화관 상영 영화 제작 편수가 감소.","대형 스크린에 맞는 경험을 주는 영화(스타워즈, 슈퍼맨, 조스(1975), 스필버그)가 성공 → 미국 영화 지배 공고.","고비용 미국 영화의 영향으로 유럽 영화의 미국화 가속: 2000년대 유럽 인기 유럽영화 상위 10편 중 절반 이상이 미국적 요소 포함.","예: 프랑스 '아스테릭스: 미션 클레오파트라', 이탈리아·프랑스·독일 합작 '피노키오', 영국·독일·프랑스 합작 '레지던트 이블'."]},{"heading":"90년대 이후의 문화적 정체성 — 문화적 예외","pages":[57,1],"points":["1993년 GATT 협상에서 영상물에 관한 논의가 쟁점이 됨.","문화적 예외(Exception culturelle): 문화적 토대에 근거한 보호주의를 옹호한 프랑스 ↔ 개방을 주장한 미국이 충돌.","프랑스의 논리: 시청각 영상물은 '정신과 영혼의 산물'이므로 일반 상품처럼 다룰 수 없다.","이후 '문화적 다양성' 개념으로 확대(슬라이드 표기 '1900년대 중반 이후'는 1990년대 중반의 오타로 보임). 2005년 유네스코 문화다양성협약으로 국제 규범이 되었다(보충).","★학생 메모(p1): 미국 vs 유럽 → 영화는 '문화적 예외'이다. 빨간 별표·물결 밑줄로 주차 최핵심 표시."]},{"heading":"국가별 영화 정체성 · 서유럽 영화 추천","pages":[58,59,60,61],"points":["영국 — 왕실과 개인의 내면, 절제된 역사극: 왕실 중심 역사극에서 시대 변화 속 인물의 내면 갈등에 초점(엘리자베스 1998, 킹스 스피치 2010, 더 크라운 2017).","프랑스 — 혁명과 저항의 역사, 민중의 시선: 혁명·저항·자유로 국가 정체성을 구성(레미제라블 1995·2012, 알제리 전투).","독일 — 역사 반성과 기억의 영화적 재현: 전쟁·나치즘·통일 등 국가 정체성과 기억을 다루며 책임과 윤리적 질문(굿바이 레닌 2003, 타인의 삶 2006, 더 리더 2008).","추천작: 독일 크리스티안 페촐트 '운디네'(2020), 프랑스 셀린 시아마 '타오르는 여인의 초상'(2019), 영국 크리스토퍼 놀란 '덩케르크'(2017)."]}],"keywords":[{"term":"문화적 예외 (Exception culturelle)","def":"영화 등 시청각 영상물은 '정신과 영혼의 산물'이므로 일반 상품처럼 자유무역에 맡길 수 없다는 프랑스의 입장. 문화적 토대에 근거한 보호주의.","detail":"1993년 GATT 협상 영상물 논의에서 프랑스(보호주의) vs 미국(개방) 충돌 → 1990년대 중반 이후 '문화적 다양성'으로 확대(슬라이드엔 '1900년대 중반'으로 표기) / 학습내용 04 '유럽영화의 방어자, 문화적 예외' / ★메모: 미국 vs 유럽 → 영화는 문화적 예외이다","pages":[57,2,1],"memo":true,"importance":3},{"term":"유럽 vs 미국의 영화 가치관","def":"유럽은 영화를 단순한 산업으로 보지 않고 '위대한 감독들의 역사'로, 미국은 영화를 산업이자 '헐리우드와 스타의 역사'로 본다.","detail":"유럽: 미국 대중문화를 비판하면서도 동경 / 미국: 유럽 문화를 현대 대중사회에 맞게 재구성해 유럽과 세계로 수출 / ★메모 '미국 vs 유럽' 대립 구도의 근거 슬라이드","pages":[36,1],"memo":true,"importance":3},{"term":"뤼미에르 형제 (Lumière)","def":"시네마토그라프를 발명해 세계 최초 유료 영화 상영을 한 프랑스 형제. 리얼리즘(실사 기록) 계열의 뿌리.","detail":"1895.12.28 파리 그랑 카페 최초 유료 상영 / 「열차의 도착」(시오타 역에 도착하는 기차, 포스터 표기 1896), 「공장을 나서는 노동자들」, 「물 뿌리는 정원사」 / 고정 카메라·일상 실사 → 다큐멘터리적 리얼리즘의 원형 → 시적 리얼리즘·누벨바그로 계승","pages":[4,5,7,12,13,15,16],"memo":false,"importance":3},{"term":"시네마토그라프 (Cinématographe)","def":"뤼미에르 형제의 촬영·영사 장치. 기술일 뿐 아니라 여러 사람이 함께 보는 '동시 관람 경험'의 발명.","detail":"'영화의 탄생은 시대의 관심사가 만들어 낸 발명' / 비교·선행 장치: 키네토스코프(에디슨), 비타스코프(토마스 아맷), 프락시노스코프(조에트로프와 에밀 레이노), 파나키스토스코프(조셉 플라토) / 키네토스코프는 한 사람씩 상자를 들여다보는 방식이었다(보충).","pages":[7,9,10,11],"memo":false,"importance":2},{"term":"왜 프랑스였나 (영화 탄생의 3가지 토양)","def":"영화가 프랑스에서 태어난 이유를 기술·전시 문화·대중오락 전통으로 설명한 질문형 슬라이드.","detail":"① 사진술(다게레오타입, 다게르)의 발상지 = 기술적 토양 ② 파리 만국박람회(포스터 1889)로 상징되는 스펙터클 전시 문화 ③ 판토마임·마술쇼가 성행한 대중오락 전통","pages":[8],"memo":false,"importance":3},{"term":"리얼리즘 vs 스펙타클 (영화의 두 뿌리)","def":"영화는 탄생부터 뤼미에르식 현실 기록(리얼리즘)과 멜리에스식 환상·볼거리(스펙타클) 사이를 오가는 '진자운동'을 해 왔다.","detail":"리얼리즘(뤼미에르) → 시적 리얼리즘·누벨바그 / 스펙타클(멜리에스) → 블록버스터·오늘날 CGI","pages":[5,12],"memo":false,"importance":3},{"term":"조르주 멜리에스 (Georges Méliès)","def":"마술사 출신으로 특수효과를 이용해 허구의 세계를 만든 '예술 영화의 선구자'이자 영화 역사상 최초의 거장.","detail":"「달세계 여행」(Le voyage dans la lune, 1902) = 허구 예술 장르로서 영화 탄생의 기점 / 이중노출·스톱모션 발명 / 영화 언어 구축, '영화산업의 시대'를 연 장본인 / 산업 경쟁에선 밀렸으나 거장으로 인정 / 각색작: 삼총사(1903), 해저 2만리(1907)","pages":[5,12,18,19,25,26],"memo":false,"importance":3},{"term":"초기 영화의 지위와 고몽 팔라스","def":"초기 영화는 1분 정도의 희극으로 예술 대접을 받지 못한 노동자 계급의 오락이었다. 1911년 고몽 팔라스 건설로 전용 대형 영화관 시대가 열림.","detail":"1분·희극(예: 물 뿌리는 정원사) → 길이가 늘며 플롯 필요, 검증된 이야기 활용 / 1905년까지 전용 영화관 없음, 시장·카페 상영, 노동자 관객(오페라와 대조) / 1911 파리 고몽 팔라스 3400석 → 1차대전 후 각국이 프랑스식 화려한 영화관 모방","pages":[14,17,20,22,23],"memo":false,"importance":2},{"term":"파테 프레르 & 고몽 (초기 프랑스 영화산업)","def":"초기 세계 영화산업을 지배한 프랑스의 두 영화사.","detail":"세계 각국 수입 영화의 60~70%가 프랑스 영화 / 파테 프레르 = 세계 최대 영화사, 식민 시장을 활용해 세계로 확장(로고: 수탉) / 경쟁사 고몽은 푀이야드의 '팡토마'로 제1의 영화사로 등극","pages":[21,23,25],"memo":false,"importance":2},{"term":"내러티브와 문학 각색 (예술로 승화된 영화)","def":"1908년 이후 긴 영화가 가능해지자 문학 작품을 각색해 이야기를 갖추면서 영화가 예술로 승화된 과정.","detail":"1908~: 15분 릴 교체로 1시간 상영 / 감독 다수 극단 출신·관객 중산층 / 코르시카 형제들(1898 조지 앨버트 스미스), 삼총사(1903 멜리에스), 여왕의 목걸이(1909 푀이야드) — 뒤마 원작 / 쥘 베른 '80일간의 세계일주'(1913, 1922~23, 1956, 2004), '해저 2만리'(1907 멜리에스, 이후 1915~1961 여러 차례)","pages":[24,25,26,27],"memo":false,"importance":3},{"term":"루이 푀이야드 (Louis Feuillade)","def":"고몽 영화사의 감독. 인기 문학과 캐릭터를 영화화해 대중적 성공을 거둠.","detail":"여왕의 목걸이(1909) / 인기 캐릭터 '팡토마' 영화화 → 고몽을 제1의 영화사로 / 고딕 장르 '뱀파이어'(Les Vampires)","pages":[25,29,30],"memo":false,"importance":2},{"term":"범죄(탐정) 영화","def":"성공한 인쇄물 장르(범죄·탐정 소설)와 함께 성공한 초기 영화 장르.","detail":"영국 '과감한 대낮의 강도질'(1903) / 미국 소설 '탐정의 왕, 닉 카터'(1908)를 프랑스가 원작보다 사색적·프랑스적으로 영화화 / 독일은 전쟁 중 탐정영화 외 많은 영화 금지 — 셜록 홈즈 모델 스튜어트 웹스(1924~1926), 여탐정 미스 노바디","pages":[28],"memo":false,"importance":1},{"term":"영화 = 예술적 창작물 (지적재산권)","def":"대중문학과 고전을 모두 각색하면서 프랑스에서 영화를 예술적 창작물로 보는 견해에 합의하고 지적재산권 등 법규를 적용하게 됨.","detail":"영화가 소설을 더 알리는 기능도 수행 / '초기 영화는 예술적 지위를 얻지 못함'(p20)과 대비되는 결과","pages":[31,20],"memo":false,"importance":2},{"term":"1차 대전 이후 미국 영화의 부상","def":"전쟁으로 유럽 영화산업이 무너진 사이 미국이 경제력을 바탕으로 세계 최대 영화 수출국이 됨.","detail":"전쟁 총동원령 → 유럽 스튜디오·영화관 폐쇄, 프랑스 생산 급감 / 1910년대 미국 영화의 유럽 침공: 독점금지법 시행·카르텔 해체, 키스톤 영화사·찰리 채플린 진출 / 프·영·독에서 미국 영화가 더 많이 상영","pages":[32],"memo":false,"importance":3},{"term":"스타 시스템 & 아메리카니즘","def":"배우를 캐릭터와 동일시하고 사생활·가십까지 확장한 미국식 체계. 미국 영화가 유럽을 양적·질적으로 능가한 요인.","detail":"+ 대규모 이민으로 유럽인 관객 시장 형성, 무거운 유럽 영화와 달리 동시대적 소재 → '유럽의 주요 문화산업으로 출발했지만 아메리카니즘이 승리'","pages":[33],"memo":false,"importance":3},{"term":"영화 유럽 (Film Europe)","def":"미국 영화의 영향력에 대한 우려로 결성된 유럽 영화 연대. 넓은 유럽 영화 시장을 연결하고 유럽의 연대감이 담긴 문화적 정체성을 추구.","detail":"효과: 유럽 각국 자국 영화 증가, 미국 영화의 유럽 진입 감소","pages":[34],"memo":false,"importance":3},{"term":"2차 대전과 파시즘의 영화","def":"나치 독일이 영화를 정치 선전에 활용하며 영화와 문화의 관계를 왜곡한 시기.","detail":"유럽을 점령한 독일이 미국에 대항하는 구조 설립 / 친독 정부 프랑스의 미국 영화 배제, 동유럽 국가의 민족영화 등장 / 결과: 범유럽주의가 아닌 왜곡된 문화정체성 → 영화정체성 위기로 장기간 정체성 논의 중단","pages":[35],"memo":false,"importance":2},{"term":"2차 대전 후 프랑스·영국 영화","def":"전후 프랑스는 비정치적인 영화로, 영국은 전쟁을 기회 삼아 성공을 거둠.","detail":"프랑스: 정치적 메시지 없는 영화들의 성공, 마르셀 카르네 '천국의 아이들'이 헐리우드 대안으로 / 영국: 18세기 오페라 관객처럼 정기적 관람, 양·질 모두 성공 — 데이비드 린 '밀회'","pages":[51,52],"memo":false,"importance":2},{"term":"이탈리아 네오리얼리즘","def":"2차 대전 후 서유럽 영화운동(프랑스 누벨바그·독일 뉴저먼 시네마)이 태동하는 바탕이 된 이탈리아의 영화 흐름.","detail":"배경: 2차대전 후 미국만 고예산 영화 제작 가능(성공작 시리즈화, 미국인 슈퍼스타) ↔ 유럽은 주류 영화의 문제를 제기하는 영화운동(프랑스·소비에트 아방가르드, 독일 표현주의)으로 예술적 표현 모색","pages":[37],"memo":false,"importance":2},{"term":"누벨바그 (Nouvelle Vague)","def":"'새로운 물결'이라는 뜻. 1950년대 말 보수적인 프랑스 사회의 권위에 도전한 젊은 평론가·감독들의 영화운동.","detail":"1959 '400번의 구타'(트뤼포)·'사촌들'(클로드 샤브롤) 개봉 후 명명 / 1958 헌법 개정·검열 약화·정부 사전 제작비 지원으로 촉진 / 거리·스튜디오 밖 촬영, 저예산, 가벼운 새 배우(장 폴 벨몽도, 브리지트 바르도) / 강요된 도덕관념 거부, 형식의 자유분방함 / 연인들(1958, 루이 말), 히로시마 내 사랑(1959)·뮈리엘(1963, 알랭 레네)","pages":[37,38,39,40,42],"memo":false,"importance":3},{"term":"카이에 뒤 시네마 & 작가주의","def":"누벨바그의 바탕. 영화감독을 문인이나 화가처럼 작품 전체를 창의적으로 책임지는 '작가'로 보는 관점.","detail":"1954 트뤼포 '프랑스 영화의 어떤 경향' — 기존 프랑스 영화가 인위적·상투적이라 비판 / 소규모 촬영팀·무명 젊은 배우·적은 예산으로 자유롭게 제작","pages":[41],"memo":false,"importance":3},{"term":"장 뤽 고다르 (Jean-Luc Godard)","def":"누벨바그를 상징하는 감독. 독일 극작가 브레히트의 이론을 영상 언어로 옮겨 헐리우드식 영화 문법을 깨뜨림.","detail":"「네 멋대로 해라」(À bout de souffle / Breathless, 1960) / 소격 효과 실험 / 헐리우드 연속 편집의 원칙 무시","pages":[38,43,44],"memo":false,"importance":3},{"term":"프랑수아 트뤼포 (François Truffaut)","def":"누벨바그를 상징하는 감독이자 평론가. 기성세대 영화를 비판하며 운동을 이끎.","detail":"1954 '프랑스 영화의 어떤 경향' / 「400번의 구타」 — 세계적인 주목, 비평가 및 대중의 지지 / 연도가 p39는 '1959년 개봉', p43은 '(1960)'으로 다름 → 실제 개봉은 1959년이다(보충).","pages":[38,39,41,43],"memo":false,"importance":3},{"term":"뉴 저먼 시네마 (New German Cinema)","def":"누벨바그의 자유로움·혁신성에 영향을 받아 60년대 말~70년대 반전운동·자본주의 비판에 호응한 독일 영화운동.","detail":"68혁명 영향, 1962 오버하우젠 선언, 60년대 후반 젊은 작가 등장 / 급진적 정치 구호·도덕적 해방 요구, 다양한 주제의식과 스타일 / 가장 강력한 시기 1970년대(독일 정치 격변기) / ★메모: 감성적 '향토영화'와 할리우드 오락영화에 대한 반발","pages":[46,47,48,50],"memo":true,"importance":3},{"term":"향토영화","def":"★학생 메모 키워드. 뉴 저먼 시네마가 할리우드 오락영화와 함께 반발한 대상인, 감성적인 방식의 독일 영화.","detail":"p47 메모 원문: [독일에서의 특징] 감성적인 방식의 '향토영화'와 할리우드의 오락영화에 대한 반발 / 독일어로 하이마트필름(Heimatfilm)이라 하며, 전후 서독에서 유행한 고향·전원 배경의 감상적 영화를 말한다(보충).","pages":[47],"memo":true,"importance":3},{"term":"오버하우젠 선언 (1962)","def":"1962년 독일 젊은 영화인들이 발표한 선언으로, 뉴 저먼 시네마의 출발점.","detail":"클루게 = '오버하우젠 선언의 정신을 구현한 작가' / 기성세대 영화를 거부하며 '아버지의 영화는 죽었다'는 구호로 유명하다(보충).","pages":[47,48],"memo":false,"importance":3},{"term":"뉴 저먼 시네마의 감독들","def":"1960년대 후반 등장한 젊은 작가들: 라이너 W. 파스빈더, 빔 벤더스, 폴커 슐뢴도르프, 베르너 헤어조크, 알렉산더 클루게.","detail":"클루게: 오버하우젠 정신 구현, 브레히트적 소격효과 강조, 1978 '독일의 가을' 제안(1967 프랑스 감독들의 반전영화 '베트남 멀리서'에서 영향) / 헤어조크: 영화 형식에 대한 끊임없는 질문·저항, 멜로드라마 기반의 감성적·사회비판적 영화 / '마리아 브라운의 결혼'은 파스빈더의 1979년 작품이다(보충).","pages":[47,48,49,50],"memo":false,"importance":2},{"term":"텔레비전 시대의 영화","def":"60년대 이후 TV 보급으로 영화관 영화 제작이 줄고, 대형 스크린용 블록버스터로 미국 지배가 굳어진 시기.","detail":"유럽은 TV를 통해 영화산업 지원: 영국 BBC·채널4, 프랑스 카날 플뤼스, 독일 ARD·ZDF / 스타워즈·슈퍼맨·조스(1975, 음악 존 윌리엄스)·스필버그","pages":[53,54],"memo":false,"importance":2},{"term":"유럽 영화의 미국화","def":"고비용 미국 영화의 영향으로 유럽 영화가 미국적 요소를 받아들이는 현상이 가속화됨.","detail":"2000년대 유럽 인기 유럽영화 상위 10편 중 절반 이상이 미국적 요소 포함 / 프랑스 '아스테릭스: 미션 클레오파트라', 이·프·독 합작 '피노키오', 영·독·프 합작 '레지던트 이블'","pages":[55,56],"memo":false,"importance":2},{"term":"국가별 영화 정체성 (영국·프랑스·독일)","def":"각국 영화가 자국의 역사와 정체성을 재현하는 방식의 차이.","detail":"영국: 왕실·개인의 내면, 절제된 역사극 — 엘리자베스(1998), 킹스 스피치(2010), 더 크라운(2017) / 프랑스: 혁명·저항·자유, 민중의 시선 — 레미제라블(1995·2012), 알제리 전투(슬라이드 표기 2009) / 독일: 전쟁·나치즘·통일, 책임·윤리적 질문 — 굿바이 레닌(2003), 타인의 삶(2006), 더 리더(2008)","pages":[58,59,60],"memo":false,"importance":2}],"memos":[{"page":1,"text":"미국 vs 유럽","kind":"손글씨","context":"표지 슬라이드 '서유럽의 영화' 오른쪽 여백, 검은 펜 손글씨","meaning":"이번 주 전체를 '미국 영화 vs 유럽 영화'의 대립 구도로 정리하라는 표시.","prof":false},{"page":1,"text":"유럽","kind":"동그라미","context":"손글씨 '미국 vs 유럽' 중 '유럽'에 검은 동그라미","meaning":"대립 구도에서 강의의 시선은 유럽 쪽(유럽이 영화를 어떻게 지켰나)에 있다는 강조.","prof":false},{"page":1,"text":"↓ 영화는 '문화적 예외' 이다.","kind":"화살표","context":"동그라미 친 '유럽'에서 아래로 파란 화살표 → 파란 펜 손글씨 문장","meaning":"유럽의 입장 = 영화는 일반 상품이 아닌 '문화적 예외'라는 것이 이 주차의 결론.","prof":false},{"page":1,"text":"'문화적 예외' (빨간 별표 + 빨간 물결 밑줄)","kind":"밑줄","context":"위 파란 손글씨 중 '문화적 예외' 아래 빨간 물결 밑줄, 왼쪽 위에 빨간 별표","meaning":"'문화적 예외'가 주차 최핵심 키워드(마지막 단원 p57 '90년대 이후의 문화적 정체성'과 연결).","prof":false},{"page":47,"text":"[독일에서의 특징] 감성적인 방식의 '향토영화' 와 할리우드의 오락영화에 대한 반발","kind":"텍스트","context":"'독일의 뉴저먼 시네마' 슬라이드 오른쪽 여백의 텍스트 상자. 68혁명 영향·1962 오버하우젠 선언·파스빈더 등 작가 목록 bullet 옆","meaning":"뉴 저먼 시네마의 독일적 특징(무엇에 반발했는가)을 강의에서 보충한 것으로, 답안에 꼭 넣을 포인트.","prof":false},{"page":47,"text":"'향토영화' (빨간 별표 + 빨간 밑줄)","kind":"밑줄","context":"위 텍스트 상자 속 '향토영화'에 빨간 직선 밑줄, 왼쪽에 빨간 별표","meaning":"뉴 저먼 시네마가 반발한 대상 '향토영화'를 핵심 용어로 암기하라는 표시.","prof":false}],"questions":[{"q":"'문화적 예외(Exception culturelle)'의 의미와 등장 배경을 설명하고, 유럽(특히 프랑스)이 영화를 문화적 예외로 보호하려는 이유를 미국과 유럽의 영화관(觀) 차이와 연결하여 서술하시오.","likelihood":3,"why":"학습내용의 마지막 주제(04 '유럽영화의 방어자, 문화적 예외')이자 결론 단원(p57). 학생 메모(p1)가 '미국 vs 유럽 → 영화는 문화적 예외'에 별표·물결 밑줄로 최고 강조.","outline":["서론: 1993년 GATT 협상에서 영상물 개방 여부가 쟁점이 되자 프랑스가 '문화적 예외'를 주장.","본론 ①(개념): 문화적 토대에 근거한 보호주의 옹호, 시청각 영상물은 '정신과 영혼의 산물'이라는 입장 ↔ 개방을 요구한 미국과 충돌.","본론 ②(배경): 1차대전 후 미국이 세계 최대 수출국으로 성장, 스타시스템·동시대 소재로 '아메리카니즘 승리' → 60년대 이후 TV·블록버스터로 지배 공고, 2000년대 유럽 영화의 미국화.","본론 ③(가치관 차이): 유럽은 영화를 산업 이상, '위대한 감독들의 역사'로 봄 vs 미국은 산업, '헐리우드와 스타의 역사'로 봄.","결론: 문화적 예외는 1990년대 중반 이후 '문화적 다양성' 개념으로 확대 → 영화는 상품이 아니라 지켜야 할 문화라는 유럽의 방어 논리."],"mustKeywords":["문화적 예외","1993 GATT","보호주의 vs 개방","정신과 영혼의 산물","문화적 다양성","아메리카니즘","산업 vs 예술(감독)"],"pages":[57,36,33,55,1,2]},{"q":"제2차 세계대전 이후 고예산 미국 영화에 맞서 등장한 프랑스 누벨바그(Nouvelle Vague)의 배경과 특징을 대표 감독과 작품을 들어 서술하시오.","likelihood":3,"why":"'고예산 미국 영화에 맞선 서유럽의 영화운동' 단원의 핵심으로 가장 많은 슬라이드(p37~45)를 차지. 학습내용 03에 해당하고 작가주의·트뤼포·고다르가 반복 등장.","outline":["서론: 2차대전 후 미국만 고예산 영화 제작 가능(성공작 시리즈화, 슈퍼스타) → 유럽은 이탈리아 네오리얼리즘을 바탕으로 주류 영화에 문제를 제기하는 영화운동 태동.","본론 ①(배경): 1950년대 말 보수적인 프랑스 사회의 권위에 도전한 젊은이들, 카이에 뒤 시네마의 작가주의(감독=작품 전체를 책임지는 작가), 1954년 트뤼포 '프랑스 영화의 어떤 경향'; 1958년 헌법 개정·검열 약화·사전 제작비 지원.","본론 ②(특징): 카메라를 들고 거리로, 적은 예산·소규모 팀·무명 배우, 스튜디오 밖 촬영의 새 스타일, 강요된 도덕관념 거부와 형식의 자유분방함.","본론 ③(감독·작품): 트뤼포 '400번의 구타'와 샤브롤 '사촌들'(1959)로 명명, 고다르 '네 멋대로 해라'(1960) — 브레히트 소격효과, 헐리우드 연속편집 무시.","결론: '새로운 물결'로 프랑스 영화계에 혁명을 일으키고 세계에 영향을 주었으며, 독일 뉴 저먼 시네마로 이어짐."],"mustKeywords":["누벨바그(새로운 물결)","네오리얼리즘","카이에 뒤 시네마","작가주의","트뤼포 '400번의 구타'","고다르 '네 멋대로 해라'","소격효과","저예산·거리 촬영"],"pages":[37,38,39,41,43]},{"q":"독일 뉴 저먼 시네마(New German Cinema)의 등장 배경과 특징을 프랑스 누벨바그와 비교하여 서술하시오.","likelihood":3,"why":"누벨바그와 짝을 이루는 단원(p46~50). 학생 메모(p47)가 '독일에서의 특징 — 향토영화와 할리우드 오락영화에 대한 반발'을 텍스트 상자로 보충하고 '향토영화'에 별표·밑줄.","outline":["서론: 60년대 말~70년대 프랑스 중심의 반전운동·자본주의 비판에 호응한 독일의 영화운동.","본론 ①(누벨바그와의 공통점): 누벨바그의 자유로움·혁신성에서 영향 — 영화문법 혁신, 정치·사회 운동, 자유주의·탈권위주의 정신 공유.","본론 ②(독일적 특징): 감성적인 '향토영화'와 할리우드 오락영화에 대한 반발(메모), 68혁명 영향, 1962년 오버하우젠 선언, 급진적 정치 구호와 도덕적 해방 요구.","본론 ③(감독): 클루게(오버하우젠 정신, 브레히트적 소격효과), 헤어조크(형식에 대한 질문·저항, 멜로드라마 기반 사회비판), 파스빈더('마리아 브라운의 결혼'), 벤더스, 슐뢴도르프.","결론: 1970년대 정치 격변기에 전성기 — 1978년 '독일의 가을'(클루게 제안)처럼 영화가 사회 비판의 장이 됨. 정리하면 누벨바그는 기성 영화의 형식·관습 혁신, 뉴 저먼 시네마는 정치·사회 비판 성격이 더 강함."],"mustKeywords":["누벨바그의 영향","68혁명","1962 오버하우젠 선언","향토영화·할리우드 오락영화에 대한 반발","반전운동·자본주의 비판","클루게·헤어조크·파스빈더","1978 '독일의 가을'"],"pages":[46,47,48,49,50]},{"q":"영화가 프랑스에서 탄생한 배경을 설명하고, 뤼미에르 형제와 조르주 멜리에스가 만든 영화의 '두 뿌리'(리얼리즘과 스펙타클)를 비교하여 서술하시오.","likelihood":3,"why":"학습내용 01 '영화의 탄생지, 서유럽'의 핵심. '왜 하필 프랑스였을까?', '리얼리즘 vs 스펙타클 — 영화의 두 뿌리'처럼 질문형·비교형 정리 슬라이드가 따로 있음.","outline":["서론: 1895년 12월 28일 파리 그랑 카페, 뤼미에르 형제의 시네마토그라프로 세계 최초 유료 상영 → '영화'라는 말 자체가 프랑스에서 시작.","본론 ①(왜 프랑스): 사진술(다게레오타입) 발상지의 기술적 토양, 파리 만국박람회의 스펙터클 전시 문화, 판토마임·마술쇼의 대중오락 전통.","본론 ②(뤼미에르=리얼리즘): '열차의 도착', '공장을 나서는 노동자들' — 고정 카메라로 일상을 실사 기록, 다큐멘터리적 리얼리즘의 원형 → 시적 리얼리즘·누벨바그.","본론 ③(멜리에스=스펙타클): '달세계 여행'(1902) — 마술사 출신, 이중노출·스톱모션 특수효과로 허구 세계, 최초의 거장·영화 언어 구축 → 블록버스터·CGI.","본론 ④(발전): 1분짜리 희극·카페 상영 → 1908년 장편화·문학 각색으로 '예술로 승화', 파테·고몽이 세계 수입 영화의 60~70% 장악.","결론: 영화사는 두 뿌리 사이의 진자운동이며, 영화가 유럽에서 시작됐다는 사실이 유럽 영화 정체성의 출발점이 됨."],"mustKeywords":["1895 그랑 카페","시네마토그라프","다게레오타입·만국박람회·판토마임","리얼리즘 vs 스펙타클","열차의 도착","달세계 여행(1902)","진자운동"],"pages":[4,5,8,12,18,24]},{"q":"제1차 세계대전 이후 미국 영화가 유럽 시장을 장악하게 된 과정과 이에 대한 유럽의 대응을 서술하시오.","likelihood":2,"why":"학습내용 02 '미국영화와 유럽영화의 경쟁'(p32~36). 원인(전쟁·독점금지법·스타시스템)과 대응(영화 유럽)이 인과 구조로 정리돼 서술형에 적합.","outline":["서론: 초기 영화산업은 프랑스가 지배(세계 수입 영화의 60~70%, 파테 프레르·고몽).","본론 ①(1차대전): 총동원령으로 유럽 스튜디오·영화관 폐쇄, 프랑스 생산 급감 ↔ 미국은 경제력으로 세계 최대 수출국. 1910년대 독점금지법·카르텔 해체, 키스톤·채플린 영화 유럽 진출.","본론 ②(미국 영화의 새 스타일): 스타시스템, 대규모 이민으로 형성된 유럽인 시장, 동시대적 소재 → 양적·질적으로 유럽을 능가, '아메리카니즘 승리'.","본론 ③(유럽의 대응): '영화 유럽(Film Europe)' 결성 — 유럽 시장 연결, 연대감 있는 문화정체성 → 자국 영화 증가·미국 영화 진입 감소. 2차대전기에는 나치 선전으로 정체성 왜곡·논의 중단.","결론: 전후 유럽은 영화를 '감독의 예술', 미국은 '산업'으로 보는 가치관 차이가 굳어짐 → 누벨바그·뉴 저먼 시네마, 문화적 예외로 이어짐."],"mustKeywords":["1차 세계대전·총동원령","독점금지법·카르텔 해체","키스톤·찰리 채플린","스타 시스템","아메리카니즘","영화 유럽(Film Europe)","나치 선전"],"pages":[21,32,33,34,35,36]},{"q":"'유럽 영화는 지루하다'는 통념을 반박하는 관점에서, 영국·프랑스·독일 영화가 각각 자국의 역사와 정체성을 어떻게 재현하는지 작품 예를 들어 서술하시오.","likelihood":2,"why":"Intro 질문('유럽 영화, 정말 지루할까?')과 마지막 국가별 정리 슬라이드(p58~60)가 수미상관 구조. 국가별 키워드와 작품이 정리돼 있어 A4 활용형 문제로 적합.","outline":["서론: 유럽은 영화를 산업보다 감독·예술로 보는 전통 → 자국 역사와 정체성을 성찰하는 영화가 많음.","본론 ①(영국): 왕실과 개인의 내면, 절제된 역사극 — 엘리자베스(1998), 킹스 스피치(2010), 더 크라운(2017).","본론 ②(프랑스): 혁명·저항·자유라는 키워드, 민중의 시선 — 레미제라블(1995·2012), 알제리 전투.","본론 ③(독일): 전쟁·나치즘·통일에 대한 역사 반성과 기억, 책임과 윤리적 질문 — 굿바이 레닌(2003), 타인의 삶(2006), 더 리더(2008).","결론: 유럽 영화는 '지루함'이 아니라 국가 정체성과 기억을 다루는 문화이며, 미국식 오락과 다른 이 가치가 '문화적 예외'의 근거가 됨."],"mustKeywords":["영국: 왕실·절제된 역사극","프랑스: 혁명·저항·민중의 시선","독일: 역사 반성·기억","킹스 스피치","레미제라블","타인의 삶","굿바이 레닌"],"pages":[3,36,58,59,60]}],"a4":["1895.12.28 파리 그랑 카페: 뤼미에르 형제 시네마토그라프로 세계 최초 유료 상영 → '영화'라는 말 자체가 프랑스에서 시작","왜 프랑스? ①사진술(다게레오타입) 발상지 ②파리 만국박람회(포스터 1889)의 스펙터클 전시 문화 ③판토마임·마술쇼 대중오락 전통","선행 장치: 키네토스코프(에디슨)·비타스코프(토마스 아맷)·프락시노스코프(에밀 레이노)·파나키스토스코프(조셉 플라토) / 시네마토그라프 = 기술 + 동시 관람 경험의 발명","리얼리즘(뤼미에르: 열차의 도착·공장을 나서는 노동자들·물 뿌리는 정원사, 고정 카메라 실사 → 시적 리얼리즘·누벨바그) vs 스펙타클(멜리에스: 달세계 여행 1902, 이중노출·스톱모션 → 블록버스터·CGI) = 진자운동","멜리에스: 마술사 출신, 영화사 최초의 거장, 영화 언어 구축, '영화산업의 시대'를 연 장본인(산업 경쟁에선 밀림)","초기 영화: 1분·희극, 1905년까지 전용관 없음, 시장·카페 상영, 노동자 관객(↔오페라) → 1911 파리 고몽 팔라스(3400석)","프랑스 지배: 세계 수입 영화 60~70%, 파테 프레르(세계 최대·식민 시장 확장) vs 고몽(푀이야드 '팡토마'로 1위)","1908~ 장편(15분 릴 교체로 1시간), 문학 각색: 코르시카 형제들(1898 G.A.스미스), 삼총사(1903 멜리에스), 여왕의 목걸이(1909 푀이야드), 해저 2만리(1907 멜리에스), 80일간의 세계일주(1913·1956 등) → 영화=예술적 창작물 합의, 지적재산권","범죄영화: 과감한 대낮의 강도질(1903 영국), 탐정의 왕 닉 카터(1908 프랑스 영화화), 독일 스튜어트 웹스(1924~26) / 고딕: 푀이야드 '뱀파이어'","1차대전 후: 총동원령→유럽 스튜디오 폐쇄, 미국 세계 최대 수출국 / 1910s 독점금지법·카르텔 해체, 키스톤·채플린 유럽 진출","미국 우위 요인: 스타시스템(사생활·가십) + 이민자 시장 + 동시대 소재 → '아메리카니즘 승리'","대응: 영화 유럽(Film Europe) → 자국 영화↑·미국 영화↓ / 2차대전: 나치 선전, 친독 프랑스의 미국 영화 배제, 동유럽 민족영화 → 왜곡된 정체성, 논의 중단","가치관: 유럽=산업 이상·위대한 감독의 역사·미국 대중문화 비판+동경 / 미국=산업·헐리우드와 스타의 역사·유럽 문화를 재구성해 수출","2차대전 후: 프랑스 비정치 영화 '천국의 아이들'(마르셀 카르네) / 영국 정기 관람·양질 성공 '밀회'(데이비드 린)","누벨바그(=새로운 물결, 1950s 말): 네오리얼리즘 바탕, 카이에 뒤 시네마·작가주의, 1954 트뤼포 '프랑스 영화의 어떤 경향', 1958 헌법 개정·검열 약화·사전 제작비 지원, 1959 '400번의 구타'(트뤼포)·'사촌들'(샤브롤), 저예산·거리·스튜디오 밖 촬영","고다르 '네 멋대로 해라'(1960): 브레히트 이론, 소격효과, 헐리우드 연속편집 무시 / 루이 말 '연인들'(1958), 알랭 레네 '히로시마 내 사랑'(1959)·'뮈리엘'(1963) / 배우 벨몽도·바르도","뉴 저먼 시네마(60s 말~70s): 누벨바그 영향, 68혁명, 1962 오버하우젠 선언, ★감성적 '향토영화'·할리우드 오락영화에 반발(메모) / 파스빈더('마리아 브라운의 결혼')·벤더스·슐뢴도르프·헤어조크·클루게 / 전성기 1970s, 1978 '독일의 가을'(클루게 제안)","60s~ TV 시대: BBC·채널4 / 카날 플뤼스 / ARD·ZDF가 영화 지원, 극장 영화 편수↓, 스타워즈·슈퍼맨·조스(1975)·스필버그 → 미국 지배 공고 / 2000s 미국화: 아스테릭스·피노키오·레지던트 이블","★문화적 예외(Exception culturelle): 1993 GATT, 프랑스 보호주의 vs 미국 개방, 시청각물=정신과 영혼의 산물 → 1990s 중반~ '문화적 다양성'","국가별: 영국 왕실·절제된 역사극(엘리자베스 1998, 킹스 스피치 2010, 더 크라운 2017) / 프랑스 혁명·저항·민중(레미제라블 1995·2012, 알제리 전투) / 독일 역사 반성·기억(굿바이 레닌 2003, 타인의 삶 2006, 더 리더 2008)"],"links":["6주차 카페: 세계 최초 유료 상영 장소가 파리 '그랑 카페'(1895)였고 초기 영화도 시장·카페에서 상영됨 → 카페가 근대 대중문화(영화)의 무대.","2주차 예술사조의 변화: 리얼리즘·표현주의·아방가르드가 영화운동(시적 리얼리즘, 독일 표현주의, 누벨바그)으로 이어짐. 작가주의는 감독을 화가·문인 같은 '예술가'로 보는 관점.","4주차 예술경영: 영화를 산업(미국)으로 볼 것인가 예술(유럽)로 볼 것인가의 대립. 정부 사전 제작비 지원(1958)·TV를 통한 영화산업 지원·문화적 예외(보호주의)는 문화예술 공공지원 정책의 사례.","3주차 대학: 누벨바그·뉴 저먼 시네마는 젊은 평론가·지식인이 권위에 도전한 운동이고, 그 배경인 68혁명은 대학생이 주도했다(보충)."],"memoTitle":"내 메모","memoHint":"PDF에 직접 적은 것","memoTag":"내 메모","short":"영화","pageCount":62}],"integrated":[{"q":"서유럽에서 예술을 주문하고 후원한 주체가 시대에 따라 어떻게 바뀌었는지 설명하고, 그 변화가 예술사조의 변화와 어떻게 맞물렸는지 종교개혁의 영향을 포함하여 서술하시오.","likelihood":2,"weeks":[2,4,5],"why":"2주차 흐름(수도원 → 대성당 → 피렌체·왕 → 교회·궁정·시민 → 귀족 살롱)과 4주차 메세나 주체 변화, 5주차 종교개혁이 각 노트의 '다른 주차와 연결'에서 서로를 가리킨다.","outline":["서론: 예술경영(메세나)은 '예술의 이상을 현실에서 뒷받침하는 일'이다. 후원 주체가 바뀌면 예술의 주제와 형식도 바뀐다","본론 ①: 중세 — 수도원 중심 로마네스크 → 십자군 이후 도시 대성당의 고딕. 교회가 예술의 무대이자 후원자였고, 로마 연극을 배척하는 대신 교회연극이 생겼다","본론 ②: 르네상스 — 부유한 금융도시 피렌체에서 시작돼 왕의 후원(프랑수아 1세의 다 빈치 초청)으로 퍼졌다","본론 ③: 종교개혁 이후 바로크 — 이탈리아(가톨릭)·프랑스(궁정)·네덜란드(시민: 집에 걸고 되팔 수 있게 작고 예쁜 그림, 2주차 메모). 로코코는 베르사유 귀족 저택의 실내장식(2주차 메모)","본론 ④: 근대~현대 — 부르주아·시장이 예술을 소비했고, 20세기엔 국가 지원(생존 위기의 예술)과 기업 메세나, 오늘날엔 시민 모두가 메세나(Tous Mécènes!)","결론: 후원 주체가 넓어지면서 예술은 세속화·대중화됐다. 주체가 바뀌어도 메세나가 남은 이유는 예술의 공공성이다"],"mustKeywords":["메세나(마이케나스)","수도원·대성당","피렌체","종교개혁","시민 바로크","로코코·살롱","국가 지원","Tous Mécènes!"]},{"q":"중세 대학과 근대의 살롱·카페를 '지식과 여론이 만들어지는 공간'이라는 관점에서 비교하여 서술하시오.","likelihood":2,"weeks":[2,3,6],"why":"3주차 '대학 밖의 주요 교육'(콜레주 루아이얄·살롱), 2주차 메모 '살롱에서 계몽주의 → 프랑스 혁명', 6주차 '페니 대학'·프로코프가 서로를 연결 지점으로 꼽는다.","outline":["서론: 서유럽의 지식·여론은 제도(대학)와 일상 공간(살롱·카페)이라는 두 축에서 만들어졌다","본론 ①: 중세 대학 — 교사·학생 자치 공동체, 신학·스콜라 철학, 라틴어로 전 유럽이 교류, 교회의 통제와 보호","본론 ②: 대학이 못 다룬 영역 — 콜레주 루아이얄(1530)과 18세기 살롱. 퐁파두르 부인 등의 로코코 살롱에 모든 사람이 모여 토론했고 계몽주의가 혁명으로 이어졌다(2주차 메모)","본론 ③: 카페 — 영국 커피하우스 '페니 대학'(1페니로 누구나 토론, 저널리즘), 파리 프로코프(계몽사상가 → 혁명 모의)","결론: 대학은 엘리트를, 살롱·카페는 시민 여론을 길렀다. 오늘날 서유럽 토론 문화의 뿌리다(한국 카페의 '개인 작업 공간'과 대비)"],"mustKeywords":["교사·학생 자치","라틴어","콜레주 루아이얄","살롱","계몽주의","페니 대학","프로코프"]},{"q":"기독교가 서유럽의 대학·예술·예술경영에 미친 영향을 설명하고, 종교개혁과 라이시테를 거치며 그 영향이 어떻게 달라졌는지 서술하시오.","likelihood":2,"weeks":[2,3,4,5],"why":"5주차 강조 문구 '유럽 기독교의 역사는 분열과 갈등의 과정', 3주차 메모 '신학 주축의 중세대학 · 라틴어 → 기독교 확산', 2주차 초기 기독교 메모, 4주차 교회연극이 서로 이어진다.","outline":["서론: 대성당이 상징하듯 유럽 문화의 중심엔 기독교(헤브라이즘)가 있었다","본론 ①: 예술 — 부활 신앙이 매장·에피기·카타콤 문화를 낳았다(2주차 메모). 313년 밀라노 칙령 이후 로마네스크·고딕 성당이 세워졌다","본론 ②: 대학 — 신학 주축의 중세대학. 교회가 교수허가증으로 통제·보호했고, 라틴어로 유학이 가능해져 기독교가 전 유럽으로 퍼졌다(3주차 메모)","본론 ③: 예술경영 — 로마 연극을 배척하는 대신 교회연극·성체축일 순환극이 생겼다","본론 ④: 분열 이후 — 16세기 종교개혁으로 독일어권(신교)과 로망스어권(가톨릭) 문화가 갈렸다. 개신교 지역은 우상숭배를 금지했고 시민 바로크가 나타났다","결론: 18세기 계몽·혁명 → 1905년 라이시테법으로 국가와 종교가 분리돼, 오늘날 서유럽엔 국교가 없다"],"mustKeywords":["헤브라이즘","밀라노 칙령(313)","신학 주축의 중세대학","라틴어","교회연극","종교개혁","라이시테(1905)"]},{"q":"유럽이 영화와 예술을 시장에만 맡기지 않고 공공이 지원하는 이유를 '문화적 예외'와 국가의 예술지원을 중심으로 미국과 비교하여 서술하시오.","likelihood":2,"weeks":[4,7],"why":"7주차 학생 메모 '미국 vs 유럽 → 영화는 문화적 예외'와 4주차 교수님 펜 강조 '국가(에 의한 예술지원)'가 같은 축이다.","outline":["서론: 미국은 영화·예술을 '산업'으로, 유럽은 '문화·예술'로 본다","본론 ①: 국가 예술지원의 배경 — 생존 위기의 예술(4주차 교수님 강조). 미국 NEA, 유럽은 2차대전 후 확대 → 1980년대 축소 → 민간 재원","본론 ②: 영화 — 1차대전 후 미국이 시장을 장악했고, 유럽은 누벨바그·뉴 저먼 시네마로 작가주의 영화를 추구했다","본론 ③: 문화적 예외 — 1993년 GATT에서 프랑스가 영상물을 '정신과 영혼의 산물'로 보고 보호했고, 이후 '문화적 다양성'으로 확대됐다","결론: 시장 논리로는 지킬 수 없는 정체성과 다양성을 공공이 지킨다는 것이 유럽의 관점이다"],"mustKeywords":["문화적 예외","1993 GATT","문화적 다양성","국가에 의한 예술지원","NEA","산업 vs 예술","작가주의"]},{"q":"18세기 계몽주의와 1789년 프랑스 혁명이 서유럽의 지식 공간·교육·종교에 남긴 변화를 살롱·카페, 대학, 라이시테를 중심으로 서술하시오.","likelihood":1,"weeks":[2,3,5,6],"why":"2주차 메모(살롱 → 계몽주의 → 혁명), 6주차 프로코프(혁명의 기폭제), 3주차 '혁명이 새로운 유형의 대학을 촉진', 5주차 라이시테 형성(18세기 계몽·혁명)이 같은 사건을 가리킨다.","outline":["서론: 계몽주의는 신앙 대신 이성과 비판을 내세웠고, 그 정점이 1789년 프랑스 혁명이다","본론 ①: 살롱·카페 — 로코코 살롱에 모든 사람이 모여 계몽주의를 토론했고(2주차 메모), 프로코프에서는 당통·마라·로베스피에르가 혁명을 모의했다","본론 ②: 대학·교육 — 국가가 실용 학교(교량도로학교·광산학교)를 지원했고, 혁명이 그랑제콜을 촉진했다. 이어 세속·무상·의무교육 원칙(쥘 페리, 3주차 메모)이 세워졌다","본론 ③: 종교 — 19세기 반기독교화를 거쳐 1801 정교협약 → 1905 라이시테법","결론: 오늘날 프랑스 공화국의 통합 원칙(라이시테·공교육)과 토론 문화의 뿌리다"],"mustKeywords":["계몽주의","살롱","프로코프","프랑스 혁명","그랑제콜","쥘 페리","1905 라이시테법"]}],"overview":["예술(2·4주차): 사조가 바뀔 때마다 예술의 무대와 후원자가 옮겨 갔다. 수도원 → 도시 대성당 → 피렌체·왕 → 교회·궁정·시민 → 귀족 살롱, 그리고 현대의 국가·기업·시민.","지식(3·6주차): 교사·학생 자치로 태어난 대학, 그리고 대학이 못 채운 자리를 메운 살롱·카페가 서유럽의 지식과 여론을 만들었다.","신앙(5주차): 분열과 갈등으로 이어진 기독교사가 대학·예술·국가의 모습을 바꿨고, 오늘날 라이시테와 이민자 종교의 갈등으로 이어진다.","대중문화(6·7주차): 영화는 1895년 파리 '그랑 카페'에서 처음 상영됐다. 이후 미국에 시장을 내줬지만, 유럽은 '문화적 예외'로 영화를 산업이 아닌 문화로 지켰다.","답안 공통 틀: 정의·배경 → 시대별 전개(영국·프랑스·독일 비교) → 의의와 오늘날(한국과 비교)."]}</script>
